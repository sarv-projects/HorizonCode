# HorizonCode CI.
#
# Payload, not the live workflow: the automation identity's GitHub App token
# has no `workflow` scope, so nothing under .github/workflows/ can be pushed
# by it. `bash ops/install-ci.sh` copies this file to .github/workflows/ci.yml;
# commit and push that with an identity that has the workflow scope.
#
# The `gates` job installs the two toolchains and hands verification to
# ops/gates.sh — the same entry point a developer runs locally. The
# `cross-platform` matrix verifies Rust kernel tests/builds, Bun typecheck,
# and targeted CLI/eval/ops tests on macOS and Windows. No secrets and no
# network beyond the toolchain/dev-type installs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    # Generous on purpose: the local run is ~15s, but a cold runner downloads a
    # toolchain and compiles the kernel from scratch.
    # Ruling 537 wall ~42m on slow hosts; 30m false-failed green trees.
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      # app/ has no RUNTIME dependencies; install dev type definitions only.
      - name: Install the app's dev type definitions
        working-directory: app
        run: bun install --frozen-lockfile

      # ops/gates.sh runs cargo test --locked, cargo build --release --locked,
      # kernel selftest, bun run typecheck, bun test, e2e smokes, latency, and
      # doc consistency in fail-fast order.
      - name: Run the gate suite
        run: bash ops/gates.sh

  cross-platform:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Test Rust kernel
        working-directory: kernel
        run: cargo test --locked

      - name: Build Rust kernel (release)
        working-directory: kernel
        run: cargo build --release --locked

      - name: Install the app's dev type definitions
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Typecheck the app
        working-directory: app
        run: bun run typecheck

      - name: Run targeted CLI, eval, and ops tests
        working-directory: app
        shell: bash
        run: bun test --timeout 30000 tests/core/cli-*.test.ts tests/core/eval-*.test.ts tests/ops/
