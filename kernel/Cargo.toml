[package]
name = "hz-kernel"
version = "0.1.0"
edition = "2021"
description = "HorizonCode trust kernel: append-only event log, receipts, guard"

[[bin]]
name = "hz-kernel"
path = "src/main.rs"

[[bin]]
name = "hz-sandbox-exec"
path = "src/bin/hz_sandbox_exec/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }
