                - heading [level=2] [ref=f79e524]:
                  - link "Copy link to checkpoints" [ref=f79e525] [cursor=pointer]:
                    - /url: "#checkpoints"
                    - generic [ref=f79e526]: Checkpoints
                - paragraph [ref=f79e534]: Checkpoints save snapshots of your codebase during an Agent session. Agent automatically creates them before making significant changes, capturing the state of all modified files.
                - paragraph [ref=f79e535]:
                  - text: If Agent takes a wrong turn, click any checkpoint in the chat timeline to preview your files at that point, then restore to revert all files to that state. You can also restore from the
                  - code [ref=f79e536]: Restore Checkpoint
                  - text: button on previous requests or the + button when hovering over a message. Restoring a checkpoint reverts files only; it does not remove messages from the conversation.
                - paragraph [ref=f79e537]: Checkpoints are useful for exploratory work, complex refactoring, and iterative development where you want safe rollback points.
                - alert [ref=f79e538]:
                  - paragraph [ref=f79e542]: Checkpoints are stored locally and separate from Git. Only use them for undoing Agent changes; use Git for permanent version control.
                - heading [level=2] [ref=f79e543]:
                  - link "Copy link to queued-messages" [ref=f79e544] [cursor=pointer]:
                    - /url: "#queued-messages"
                    - generic [ref=f79e545]: Queued messages
                - paragraph [ref=f79e553]:
                  - text: You have two ways to talk to an agent while it works. Queue a message and it waits for the current task to finish.
                  - link "Send a follow-up now" [ref=f79e554] [cursor=pointer]:
                    - /url: "#steer-a-running-agent"
                  - text: and it steers the active turn at the agent's next tool call.
                - heading [level=3] [ref=f79e556]:
                  - link "Copy link to using-the-queue" [ref=f79e557] [cursor=pointer]:
                    - /url: "#using-the-queue"
                    - generic [ref=f79e558]: Using the queue
                - list [ref=f79e566]:
                  - listitem [ref=f79e567]: While Agent is working, type your next instruction
                  - listitem [ref=f79e568]:
                    - text: Press
                    - generic [ref=f79e569]: Enter
                    - text: to add it to the queue
                  - listitem [ref=f79e571]: Messages appear in order below the active task
                  - listitem [ref=f79e572]: Drag to reorder queued messages as needed
                  - listitem [ref=f79e573]: Agent processes them sequentially after finishing
                - heading [level=3] [ref=f79e574]:
                  - link "Copy link to keyboard-shortcuts" [ref=f79e575] [cursor=pointer]:
                    - /url: "#keyboard-shortcuts"
                    - generic [ref=f79e576]: Keyboard shortcuts
                - paragraph [ref=f79e584]: "While Agent is working:"
                - list [ref=f79e585]:
                  - listitem [ref=f79e586]:
                    - text: Press
                    - generic [ref=f79e587]: Enter
                    - text: to queue your message (it waits until Agent finishes the current task)
                  - listitem [ref=f79e589]:
                    - text: Press
                    - generic [ref=f79e590]: Ctrl+Enter
                    - text: to send immediately, bypassing the queue
                - heading [level=3] [ref=f79e592]:
                  - link "Copy link to immediate-messaging" [ref=f79e593] [cursor=pointer]:
                    - /url: "#immediate-messaging"
                    - generic [ref=f79e594]: Immediate messaging
                - paragraph [ref=f79e602]:
                  - text: When you use
                  - generic [ref=f79e603]: Ctrl+Enter
                  - text: to send immediately, your message is appended to the most recent user message in the chat and processed right away without waiting in the queue.
                - list [ref=f79e605]:
                  - listitem [ref=f79e606]: Your message attaches to tool results and sends immediately
                  - listitem [ref=f79e607]: This creates a more responsive experience for urgent follow-ups
                  - listitem [ref=f79e608]: Use this when you need to interrupt or redirect Agent's current work
                - heading [level=3] [ref=f79e609]:
                  - link "Copy link to steer-a-running-agent" [ref=f79e610] [cursor=pointer]:
                    - /url: "#steer-a-running-agent"
                    - generic [ref=f79e611]: Steer a running agent
                - paragraph [ref=f79e619]:
                  - text: You can send a follow-up to steer the agent while it's working, without interrupting it. Type a follow-up and hit
                  - strong [ref=f79e620]: Send now
                  - text: ", or press"
                  - generic [ref=f79e621]: Enter
                  - text: twice. The message is delivered at the agent's next tool call instead of cutting off work mid-action, which preserves in-flight work and keeps the agent on task.
                - paragraph [ref=f79e623]:
                  - text: This is available on
                  - link "cursor.com/agents" [ref=f79e624] [cursor=pointer]:
                    - /url: https://cursor.com/agents
                  - text: now and rolling out in the
                  - link "Agents Window" [ref=f79e625] [cursor=pointer]:
                    - /url: /docs/agent/agents-window
                  - text: . Press
                  - generic [ref=f79e626]: Tab
                  - text: to queue the message for after the turn instead.
                - paragraph [ref=f79e628]:
                  - text: In the
                  - link "CLI" [ref=f79e629] [cursor=pointer]:
                    - /url: /docs/cli/overview
                  - text: ", pressing"
                  - generic [ref=f79e630]: Enter
                  - text: while the agent works steers the active run at a safe boundary, and pressing
                  - generic [ref=f79e632]: Enter
                  - text: again interrupts the turn.
                - heading [level=2] [ref=f79e634]:
                  - link "Copy link to side-chats" [ref=f79e635] [cursor=pointer]:
                    - /url: "#side-chats"
                    - generic [ref=f79e636]: Side chats
                - paragraph [ref=f79e644]:
                  - text: Open a
                  - link "side chat" [ref=f79e645] [cursor=pointer]:
                    - /url: /help/ai-features/side-chats
                  - text: to ask a question or investigate a tangent without interrupting the main conversation. Type
                  - code [ref=f79e646]: /side
                  - text: or
                  - code [ref=f79e647]: /btw
                  - text: in the chat input, optionally followed by your question, or use the plus button at the top of the chat panel.
                - paragraph [ref=f79e648]: A side chat is a durable agent conversation. It uses the parent thread as hidden reference context and keeps its own transcript. @-mention the side chat in the main thread to pull that context back.
                - heading [level=2] [ref=f79e649]:
                  - link "Copy link to conversation-search" [ref=f79e650] [cursor=pointer]:
