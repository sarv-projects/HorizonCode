              - generic [ref=f79e392]:
                - heading "Cursor Agent" [level=1] [ref=f79e393]
                - paragraph [ref=f79e394]:
                  - text: Agent is Cursor's assistant that can complete complex coding tasks independently, run terminal commands, and edit code. Access in sidepane with
                  - generic [ref=f79e395]: Ctrl+I
                  - text: .
                - paragraph [ref=f79e397]:
                  - text: Learn more about
                  - link "how agents work" [ref=f79e398] [cursor=pointer]:
                    - /url: /learn/agents
                  - text: and help you build faster.
                - paragraph [ref=f79e399]:
                  - text: For a larger body of work, such as a feature or a migration, create a
                  - link "Project" [ref=f79e400] [cursor=pointer]:
                    - /url: /docs/agent/projects
                  - text: ": a coordinator agent plans the work and delegates it to other agents."
                - region "video player" [ref=f79e405]:
                  - button "play" [ref=f79e409] [cursor=pointer]
                - heading [level=2] [ref=f79e413]:
                  - link "Copy link to how-agent-works" [ref=f79e414] [cursor=pointer]:
                    - /url: "#how-agent-works"
                    - generic [ref=f79e415]: How Agent works
                - paragraph [ref=f79e423]: "An agent is built on three components:"
                - list [ref=f79e424]:
                  - listitem [ref=f79e425]:
                    - strong [ref=f79e426]: Instructions
                    - text: ": The system prompt and"
                    - link "rules" [ref=f79e427] [cursor=pointer]:
                      - /url: /docs/rules
                    - text: that guide agent behavior
                  - listitem [ref=f79e428]:
                    - strong [ref=f79e429]: Tools
                    - text: ": File editing, codebase search, terminal execution, and more"
                  - listitem [ref=f79e430]:
                    - strong [ref=f79e431]: Model
                    - text: ": The agent model you pick for the task"
                - paragraph [ref=f79e432]: Cursor's agent orchestrates these components for each model we support, tuning instructions and tools specifically for every frontier model. As new models are released, you can focus on building software while Cursor handles the model-specific optimizations.
                - heading [level=2] [ref=f79e433]:
                  - link "Copy link to tools" [ref=f79e434] [cursor=pointer]:
                    - /url: "#tools"
                    - generic [ref=f79e435]: Tools
                - paragraph [ref=f79e443]: Tools are the building blocks of Agent. They are used to search your codebase and the web to find relevant information, make edits to your files, run terminal commands, and more.
                - paragraph [ref=f79e444]:
                  - text: To understand how tool calling works under the hood, see our
                  - link "tool calling fundamentals" [ref=f79e445] [cursor=pointer]:
                    - /url: /learn/tool-calling
                  - text: .
                - paragraph [ref=f79e446]: There is no limit on the number of tool calls Agent can make during a task.
                - generic [ref=f79e447]:
                  - generic [ref=f79e448]:
                    - heading [level=3] [ref=f79e449]:
                      - button "Search files and folders" [ref=f79e450] [cursor=pointer]
