                  - generic [ref=f32e1177]: "],"
                  - generic [ref=f32e1178]: "};"
                  - generic [ref=f32e1179]: "});"
              - paragraph [ref=f32e1180]:
                - text: See this
                - link "example server" [ref=f32e1181] [cursor=pointer]:
                  - /url: https://github.com/msfeldstein/mcp-test-servers/blob/main/src/image-server.js
                - text: for implementation details. Cursor attaches returned images to the chat. If the model supports images, it analyzes them.
              - heading [level=2] [ref=f32e1182]:
                - link "Copy link to security-considerations" [ref=f32e1183] [cursor=pointer]:
                  - /url: "#security-considerations"
                  - generic [ref=f32e1184]: Security considerations
              - paragraph [ref=f32e1192]: "When installing MCP servers, consider these security practices:"
              - list [ref=f32e1193]:
                - listitem [ref=f32e1194]:
                  - strong [ref=f32e1195]: Verify the source
                  - text: ": Only install MCP servers from trusted developers and repositories"
                - listitem [ref=f32e1196]:
                  - strong [ref=f32e1197]: Review permissions
                  - text: ": Check what data and APIs the server will access"
                - listitem [ref=f32e1198]:
                  - strong [ref=f32e1199]: Limit API keys
                  - text: ": Use restricted API keys with minimal required permissions"
                - listitem [ref=f32e1200]:
                  - strong [ref=f32e1201]: Audit code
                  - text: ": For critical integrations, review the server's source code"
              - paragraph [ref=f32e1202]: Remember that MCP servers can access external services and execute code on your behalf. Always understand what a server does before installation.
              - heading [level=2] [ref=f32e1203]:
                - link "Copy link to real-world-examples" [ref=f32e1204] [cursor=pointer]:
                  - /url: "#real-world-examples"
                  - generic [ref=f32e1205]: Real-world examples
              - paragraph [ref=f32e1213]: "For practical examples of MCP in action:"
              - list [ref=f32e1214]:
                - listitem [ref=f32e1215]:
                  - strong [ref=f32e1216]:
                    - link "Xcode integration" [ref=f32e1217] [cursor=pointer]:
