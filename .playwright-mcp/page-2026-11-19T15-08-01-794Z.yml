                  - generic [ref=f32e1147]: Images as context
              - paragraph [ref=f32e1155]: "MCP servers can return images - screenshots, diagrams, etc. Return them as base64 encoded strings:"
              - generic [ref=f32e1158]:
                - button [ref=f32e1159] [cursor=pointer]
                - code [ref=f32e1165]:
