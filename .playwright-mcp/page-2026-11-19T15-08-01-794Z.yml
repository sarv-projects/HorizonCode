              - heading [level=3] [ref=f32e987]:
                - link "Copy link to authentication" [ref=f32e988] [cursor=pointer]:
                  - /url: "#authentication"
                  - generic [ref=f32e989]: Authentication
              - paragraph [ref=f32e997]: MCP servers use environment variables for authentication. Pass API keys and tokens through the config.
              - paragraph [ref=f32e998]: Cursor supports OAuth for servers that require it. Sign-in uses the authorization code flow with PKCE. Cursor reads the server's protected resource metadata (RFC 9728) to find its authorization server and resource indicator (RFC 8707). With dynamic client registration, Cursor registers as a public client with no client secret.
              - paragraph [ref=f32e999]:
                - text: Cursor renews an expired access token with the refresh token the server issued. If the server returns an access token with an expiry (
                - code [ref=f32e1000]: expires_in
                - text: ) and no refresh token, you sign in again when the token expires. If your provider issues refresh tokens only for a scope such as
                - code [ref=f32e1001]: offline_access
                - text: ", add that scope to"
                - link [ref=f32e1002] [cursor=pointer]:
                  - /url: "#static-oauth-for-remote-servers"
                  - code [ref=f32e1003]: auth.scopes
                - text: .
              - heading [level=2] [ref=f32e1004]:
                - link "Copy link to enterprise-admin-controls" [ref=f32e1005] [cursor=pointer]:
                  - /url: "#enterprise-admin-controls"
                  - generic [ref=f32e1006]: Enterprise admin controls
              - paragraph [ref=f32e1014]: MCP distribution and MCP policy are configured separately. Team admins can distribute shared MCP servers. Enterprise admins can configure MCP policy.
              - heading [level=3] [ref=f32e1015]:
                - link "Copy link to team-mcp-distribution" [ref=f32e1016] [cursor=pointer]:
                  - /url: "#team-mcp-distribution"
                  - generic [ref=f32e1017]: Team MCP distribution
              - paragraph [ref=f32e1025]:
                - text: Configure shared Team MCP servers under
                - strong [ref=f32e1026]: Dashboard > Plugins & MCPs
                - text: . These servers are available to Cloud Agents.
              - paragraph [ref=f32e1027]:
                - text: To run Team MCP servers only on members' computers by default, a team admin turns on
                - strong [ref=f32e1028]: Run connectors only on members' computers
                - text: in the team's MCP settings under
                - strong [ref=f32e1029]: Dashboard > Plugins & MCPs
                - text: . Cloud Agents can't connect to a server that runs only on members' computers. Turn the switch off to let Cloud Agents use them again.
              - paragraph [ref=f32e1030]:
                - text: A Team MCP server's config and a team plugin's variables are shared by the whole team. Editing them from any surface, including an automation's MCP settings, changes the value for every teammate and automation that uses them. Only team admins can edit a Team MCP server or replace credentials a team plugin already has. Org admins have the same access on every team linked to their
                - link "Organization" [ref=f32e1031] [cursor=pointer]:
                  - /url: /docs/enterprise/organizations
                - text: ", even without a team admin role."
              - paragraph [ref=f32e1032]:
                - text: To make an existing standalone Team MCP server available in the Agent Window, IDE, and CLI, select
                - strong [ref=f32e1033]: Add to Team Marketplace
                - text: under
                - strong [ref=f32e1034]: Team MCP Servers
                - text: . Cursor links the server to the Default team marketplace without interrupting Cloud Agent access. Teammates can then install and configure it from Customize.
              - paragraph [ref=f32e1035]:
                - text: Linking an MCP server to a marketplace does not install or enable it for everyone. Configure
                - strong [ref=f32e1036]: Marketplace Access
                - text: and plugin installation modes under
                - strong [ref=f32e1037]: Dashboard > Plugins & MCPs
                - text: . See
                - link "Migrate existing Team MCPs" [ref=f32e1038] [cursor=pointer]:
                  - /url: /docs/plugins#migrate-existing-team-mcps
                - text: for the full flow.
              - heading [level=3] [ref=f32e1039]:
                - link "Copy link to mcp-allowlist" [ref=f32e1040] [cursor=pointer]:
                  - /url: "#mcp-allowlist"
                  - generic [ref=f32e1041]: MCP Allowlist
              - paragraph [ref=f32e1049]:
                - text: Enterprise admins can control which MCP servers users may run from the Cursor dashboard. Open
                - link "Team Settings > MCP Configuration" [ref=f32e1050] [cursor=pointer]:
                  - /url: https://cursor.com/dashboard/team-settings?view=mcp-configuration
                - text: to configure which servers and tools the team may run. The Plugins & MCPs page also links here. Allowlisting approves an MCP configuration. It does not distribute or install the server.
              - paragraph [ref=f32e1051]: "Use the MCP Allowlist to define approved servers:"
              - list [ref=f32e1052]:
                - listitem [ref=f32e1053]:
                  - strong [ref=f32e1054]: Command entries
                  - text: approve local
                  - code [ref=f32e1055]: stdio
                  - text: MCP servers by command pattern.
                - listitem [ref=f32e1056]:
                  - strong [ref=f32e1057]: URL entries
                  - text: approve remote HTTP/SSE MCP servers by URL entry pattern.
                - listitem [ref=f32e1058]:
                  - strong [ref=f32e1059]: Tool allowlists
                  - text: restrict which tools from an approved server can run automatically. Leave a tool allowlist empty to allow all tools from that server.
              - heading [level=3] [ref=f32e1060]:
                - link "Copy link to network-controls" [ref=f32e1061] [cursor=pointer]:
                  - /url: "#network-controls"
                  - generic [ref=f32e1062]: Network controls
              - paragraph [ref=f32e1070]: Remote MCP URLs are restricted to the configured URL entry pattern.
              - paragraph [ref=f32e1071]: "Local command-based MCP servers use their per-server network mode:"
              - list [ref=f32e1072]:
                - listitem [ref=f32e1073]:
                  - strong [ref=f32e1074]: Allow all
                  - text: ": allow outbound network access."
                - listitem [ref=f32e1075]:
                  - strong [ref=f32e1076]: Allowlist
                  - text: ": allow only listed destinations."
                - listitem [ref=f32e1077]:
                  - strong [ref=f32e1078]: Deny all
                  - text: ": block outbound network access."
                - listitem [ref=f32e1079]:
                  - strong [ref=f32e1080]: No sandbox
                  - text: ": run without command or network sandboxing."
              - heading [level=3] [ref=f32e1081]:
                - link "Copy link to user-mcp-extensions" [ref=f32e1082] [cursor=pointer]:
                  - /url: "#user-mcp-extensions"
                  - generic [ref=f32e1083]: User MCP extensions
              - paragraph [ref=f32e1091]: Admins can allow users to configure their own MCP servers outside admin-defined command or URL patterns. For user MCPs that do not match an admin-defined pattern, the User MCP Network Denylist can block matching network destinations.
              - heading [level=2] [ref=f32e1092]:
                - link "Copy link to using-mcp-in-chat" [ref=f32e1093] [cursor=pointer]:
                  - /url: "#using-mcp-in-chat"
                  - generic [ref=f32e1094]: Using MCP in chat
              - paragraph [ref=f32e1102]:
                - text: Cursor automatically uses MCP tools listed under
                - code [ref=f32e1103]: Available Tools
                - text: when relevant. This includes
                - link "Plan Mode" [ref=f32e1104] [cursor=pointer]:
                  - /url: /docs/agent/plan-mode
                - text: . Ask for a specific tool by name or describe what you need. Enable or disable MCP servers from
                - strong [ref=f32e1105]: Customize
                - text: in the sidebar.
              - heading [level=3] [ref=f32e1106]:
                - link "Copy link to tool-approval" [ref=f32e1107] [cursor=pointer]:
                  - /url: "#tool-approval"
                  - generic [ref=f32e1108]: Tool approval
              - paragraph [ref=f32e1116]: Cursor asks for approval before using MCP tools by default. Click the arrow next to the tool name to see arguments.
              - button "Open image in full screen" [ref=f32e1117] [cursor=pointer]:
                - img "Tool confirmation prompt" [ref=f32e1118]
              - heading [level=4] [ref=f32e1119]:
                - link "Copy link to run-mode" [ref=f32e1120] [cursor=pointer]:
                  - /url: "#run-mode"
                  - generic [ref=f32e1121]: Run Mode
              - paragraph [ref=f32e1129]:
                - text: MCP
                - link "follows the same Run Modes as terminal commands" [ref=f32e1130] [cursor=pointer]:
                  - /url: /docs/agent/security/run-modes#run-mode
                - text: . For example, in
                - strong [ref=f32e1131]: Auto-review
                - text: mode, allowlisted MCP tools run immediately and everything else is routed through the classifier.
              - heading [level=3] [ref=f32e1132]:
                - link "Copy link to tool-response" [ref=f32e1133] [cursor=pointer]:
                  - /url: "#tool-response"
                  - generic [ref=f32e1134]: Tool response
              - paragraph [ref=f32e1142]: "Cursor shows the response in chat with expandable views of arguments and responses:"
              - button "Open image in full screen" [ref=f32e1143] [cursor=pointer]:
                - img "MCP tool call result" [ref=f32e1144]
              - heading [level=3] [ref=f32e1145]:
