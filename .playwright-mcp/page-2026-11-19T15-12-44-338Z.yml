                - row [ref=f187e996]:
                  - cell [ref=f187e997]:
                    - strong [ref=f187e998]: "3.6"
                  - cell "May 29, 2026" [ref=f187e999]
                  - cell [ref=f187e1000]:
                    - link "Auto-review" [ref=f187e1001] [cursor=pointer]:
                      - /url: /changelog/auto-review
                    - text: shipped as the recommended default.
                - row [ref=f187e1002]:
                  - cell [ref=f187e1003]:
                    - strong [ref=f187e1004]: "3.5"
                  - cell "May 22, 2026" [ref=f187e1005]
