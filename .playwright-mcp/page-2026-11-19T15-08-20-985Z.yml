              - text: as the editor. You can create rules in the
              - code [ref=f46e493]: .cursor/rules
              - text: directory to provide context and guidance to the agent. These rules will be automatically loaded and applied based on their configuration, allowing you to customize the agent's behavior for different parts of your project or specific file types.
