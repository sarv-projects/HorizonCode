                - generic [ref=f46e444]: Prompting
            - paragraph [ref=f46e452]: Stating intent clearly is recommended for the best results. For example, you can use the prompt "do not write any code" to ensure that the agent won't edit any files. This is generally helpful when planning tasks before implementing them.
            - paragraph [ref=f46e453]: Agent has tools for file operations, searching, running shell commands, and web access.
