                - generic [ref=f46e711]: Non-interactive mode
            - paragraph [ref=f46e719]:
              - text: Use
              - code [ref=f46e720]: "-p"
              - text: or
              - code [ref=f46e721]: "--print"
              - text: to run Agent in non-interactive mode. This will print the response to the console.
            - paragraph [ref=f46e722]: With non-interactive mode, you can invoke Agent in a non-interactive way. This allows you to integrate it in scripts, CI pipelines, etc.
            - paragraph [ref=f46e723]:
              - text: You can combine this with
              - code [ref=f46e724]: "--output-format"
              - text: to control how the output is formatted. For example, use
              - code [ref=f46e725]: "--output-format json"
              - text: for structured output that's easier to parse in scripts, or
              - code [ref=f46e726]: "--output-format text"
              - text: for plain text output of the agent's final response.
            - alert [ref=f46e727]:
