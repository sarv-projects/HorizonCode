              - text: Agent supports
              - link "MCP (Model Context Protocol)" [ref=f46e465] [cursor=pointer]:
                - /url: /marketplace
              - text: for extended functionality and integrations. The CLI will automatically detect and respect your
              - code [ref=f46e466]: mcp.json
              - text: configuration file, enabling the same MCP servers and tools that you've configured for the editor.
