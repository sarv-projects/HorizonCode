    - main [ref=f122e384]:
      - generic [ref=f122e387]:
        - generic [ref=f122e388]:
          - generic [ref=f122e389]: Agent
          - generic [ref=f122e391]:
            - heading "Agents Window" [level=1] [ref=f122e392]
            - paragraph [ref=f122e393]: The Agents Window is Cursor's agent-first interface. It provides a unified workspace to build with agents across repos and environments, including local, cloud, remote SSH, and more. It combines the power of parallel agents with the depth and control of a development environment.
            - paragraph [ref=f122e394]: You can switch back to the editor anytime, or have both open simultaneously.
            - heading [level=2] [ref=f122e398]:
              - link "Copy link to open-the-agents-window" [ref=f122e399] [cursor=pointer]:
                - /url: "#open-the-agents-window"
                - generic [ref=f122e400]: Open the Agents Window
            - paragraph [ref=f122e408]:
              - text: If you're in the editor, type
              - generic [ref=f122e409]: Ctrl+Shift+P Arrow Right Open Agents Window
              - text: to open the Agents Window.
            - button "Open image in full screen" [ref=f122e411] [cursor=pointer]:
              - img "Command Palette showing the Open Agents Window command" [ref=f122e412]
            - heading [level=2] [ref=f122e413]:
              - link "Copy link to switch-back-to-the-ide" [ref=f122e414] [cursor=pointer]:
                - /url: "#switch-back-to-the-ide"
                - generic [ref=f122e415]: Switch Back to the IDE
            - paragraph [ref=f122e423]:
              - text: To return to the classic Cursor IDE, type
              - generic [ref=f122e424]: Ctrl+Shift+P Arrow Right Open IDE
              - text: . This opens the current workspace in the editor.
            - button "Open image in full screen" [ref=f122e426] [cursor=pointer]:
              - img "Actions menu showing the Open IDE command" [ref=f122e427]
            - paragraph [ref=f122e428]:
              - text: If you want to view or edit files without leaving the Agents Window, you can type
              - generic [ref=f122e429]: Ctrl+P
              - text: to search files, or
              - generic [ref=f122e431]: Ctrl+Shift+F
              - text: to search all files.
            - button "Open image in full screen" [ref=f122e433] [cursor=pointer]:
              - img "Agents Window showing file search and file viewing" [ref=f122e434]
            - heading [level=2] [ref=f122e435]:
              - link "Copy link to features-available-only-in-the-agents-window" [ref=f122e436] [cursor=pointer]:
                - /url: "#features-available-only-in-the-agents-window"
                - generic [ref=f122e437]: Features Available Only in the Agents Window
            - paragraph [ref=f122e445]: "The following features are available in the Agents Window:"
            - list [ref=f122e446]:
              - listitem [ref=f122e447]:
                - strong [ref=f122e448]: "Multi-workspace:"
                - text: work with agents across all your projects from one place.
              - listitem [ref=f122e449]:
                - strong [ref=f122e450]: "New diffs view:"
                - text: review and commit changes, and manage PRs without leaving Cursor.
              - listitem [ref=f122e451]:
                - strong [ref=f122e452]: "Parallel agents:"
                - text: run many parallel agents in the cloud (and work with them from your phone, web, Slack, GitHub, and Linear).
              - listitem [ref=f122e453]:
                - strong [ref=f122e454]: "Easier handoff between local and cloud:"
                - text: quickly move an agent from cloud to local to iterate quickly, and move it back to the cloud so it keeps working on its own.
              - listitem [ref=f122e455]:
                - strong [ref=f122e456]: "Cloud subagents:"
                - text: hand off a task to a
                - link "cloud subagent" [ref=f122e457] [cursor=pointer]:
                  - /url: /docs/subagents#cloud-subagents
                - text: with
                - code [ref=f122e458]: /in-cloud
                - text: ", or put a PR on"
                - code [ref=f122e459]: /autopilot
                - text: ", so long-running work runs on its own VM and branch while you keep working locally."
              - listitem [ref=f122e460]:
                - strong [ref=f122e461]: "Worktrees:"
                - link "run agents in isolated Git checkouts" [ref=f122e462] [cursor=pointer]:
                  - /url: /docs/configuration/worktrees
                - text: so each task has its own files and changes.
            - heading [level=2] [ref=f122e463]:
              - link "Copy link to choosing-between-agents-window-and-editor" [ref=f122e464] [cursor=pointer]:
                - /url: "#choosing-between-agents-window-and-editor"
                - generic [ref=f122e465]: Choosing Between Agents Window and Editor
            - paragraph [ref=f122e473]: The Agents Window works well when you want to run and manage many agents in parallel. If you are using agents to write most of your code, the Agents Window helps pull you up to a higher level of abstraction.
            - paragraph [ref=f122e474]: The editor works well when you want the classic IDE with VS Code extensions and flexible screen splitting to see many files at once.
            - paragraph [ref=f122e475]: You can move between the two interfaces, and we will continue to support and improve both experiences.
            - heading [level=2] [ref=f122e476]:
              - link "Copy link to enterprise-access" [ref=f122e477] [cursor=pointer]:
                - /url: "#enterprise-access"
                - generic [ref=f122e478]: Enterprise access
            - paragraph [ref=f122e486]: Agents Window is generally available with Cursor 3, released on April 2, 2026. For the two weeks following launch, Enterprise Admins can control rollout within their organizations by giving access to their entire team or to specific users via Team settings. After the rollout period, all users will have access by default.
