            - heading [level=3] [ref=f14e740]:
              - link "Copy link to creating-a-rule" [ref=f14e741] [cursor=pointer]:
                - /url: "#creating-a-rule"
                - generic [ref=f14e742]: Creating a rule
            - paragraph [ref=f14e750]: "There are two ways to create rules:"
            - list [ref=f14e751]:
              - listitem [ref=f14e752]:
                - strong [ref=f14e753]:
                  - code [ref=f14e754]: /create-rule
                  - text: in chat
                - text: ": Type"
                - code [ref=f14e755]: /create-rule
                - text: in Agent and describe what you want. Agent generates the rule file with proper frontmatter and saves it to
                - code [ref=f14e756]: .cursor/rules
                - text: .
              - listitem [ref=f14e757]:
                - strong [ref=f14e758]: From Customize
                - text: ": Open"
                - strong [ref=f14e759]: Customize
                - text: in the sidebar, go to
                - strong [ref=f14e760]: Rules
                - text: ", and click"
                - strong [ref=f14e761]: Add Rule
                - text: . This creates a new rule file in
                - code [ref=f14e762]: .cursor/rules
                - text: . From Customize you can see all rules and their status.
            - heading [level=2] [ref=f14e763]:
              - link "Copy link to best-practices" [ref=f14e764] [cursor=pointer]:
                - /url: "#best-practices"
                - generic [ref=f14e765]: Best practices
            - paragraph [ref=f14e773]: Good rules are focused, actionable, and scoped.
            - list [ref=f14e774]:
              - listitem [ref=f14e775]: Keep rules under 500 lines
              - listitem [ref=f14e776]: Split large rules into multiple, composable rules
              - listitem [ref=f14e777]: Provide concrete examples or referenced files
              - listitem [ref=f14e778]: Avoid vague guidance. Write rules like clear internal docs
              - listitem [ref=f14e779]: Reuse rules when repeating prompts in chat
              - listitem [ref=f14e780]: Reference files instead of copying their contents. This keeps rules short and prevents them from becoming stale as code changes. Agent reads a referenced file when it needs it, so tell it what to look for there
            - heading [level=3] [ref=f14e781]:
              - link "Copy link to what-to-avoid-in-rules" [ref=f14e782] [cursor=pointer]:
                - /url: "#what-to-avoid-in-rules"
                - generic [ref=f14e783]: What to avoid in rules
            - list [ref=f14e791]:
              - listitem [ref=f14e792]:
                - strong [ref=f14e793]: Copying entire style guides
                - text: ": Use a linter instead. Agent already knows common style conventions."
              - listitem [ref=f14e794]:
                - strong [ref=f14e795]: Documenting every possible command
                - text: ": Agent knows common tools like npm, git, and pytest."
              - listitem [ref=f14e796]:
                - strong [ref=f14e797]: Adding instructions for edge cases that rarely apply
                - text: ": Keep rules focused on patterns you use frequently."
              - listitem [ref=f14e798]:
                - strong [ref=f14e799]: Duplicating what's already in your codebase
                - text: ": Point to canonical examples instead of copying code."
            - alert [ref=f14e800]:
              - paragraph [ref=f14e804]: Start simple. Add rules only when you notice Agent making the same mistake repeatedly. Don't over-optimize before you understand your patterns.
            - paragraph [ref=f14e805]:
              - text: Check your rules into git so your whole team benefits. When you see Agent make a mistake, update the rule. You can even tag
              - code [ref=f14e806]: "@cursor"
              - text: on a GitHub issue or PR to have Agent update the rule for you.
            - heading [level=2] [ref=f14e807]:
              - link "Copy link to rule-file-format" [ref=f14e808] [cursor=pointer]:
                - /url: "#rule-file-format"
                - generic [ref=f14e809]: Rule file format
            - paragraph [ref=f14e817]: Each rule is a markdown file with frontmatter metadata and content. The frontmatter metadata is used to control how the rule is applied. The content is the rule itself.
            - generic [ref=f14e820]:
              - button [ref=f14e821] [cursor=pointer]
              - code [ref=f14e827]:
                - generic [ref=f14e828]: "---"
                - generic [ref=f14e829]: "description: \"This rule provides standards for frontend components and API validation\""
                - generic [ref=f14e830]: "alwaysApply: false"
                - generic [ref=f14e831]: "---"
                - generic [ref=f14e833]: ...rest of the rule content
            - paragraph [ref=f14e834]: If alwaysApply is true, the rule will be applied to every chat session. Otherwise, the description of the rule will be presented to the Cursor Agent to decide if it should be applied.
            - heading [level=2] [ref=f14e835]:
              - link "Copy link to examples" [ref=f14e836] [cursor=pointer]:
                - /url: "#examples"
                - generic [ref=f14e837]: Examples
            - generic [ref=f14e845]:
              - heading [level=3] [ref=f14e847]:
                - button "Standards for frontend components and API validation" [ref=f14e848] [cursor=pointer]
              - heading [level=3] [ref=f14e852]:
                - button "Templates for Express services and React components" [ref=f14e853] [cursor=pointer]
              - heading [level=3] [ref=f14e857]:
                - button "Automating development workflows and documentation generation" [ref=f14e858] [cursor=pointer]
              - heading [level=3] [ref=f14e862]:
                - button "Adding a new setting in Cursor" [ref=f14e863] [cursor=pointer]
            - paragraph [ref=f14e866]: Examples are available from providers and frameworks. Community-contributed rules are found across crowdsourced collections and repositories online.
            - heading [level=2] [ref=f14e867]:
              - link "Copy link to team-rules" [ref=f14e868] [cursor=pointer]:
                - /url: "#team-rules"
                - generic [ref=f14e869]: Team Rules
            - paragraph [ref=f14e877]:
              - text: Team and
              - link "Enterprise" [ref=f14e878] [cursor=pointer]:
                - /url: /docs/enterprise
              - text: plans can create and enforce rules across their entire organization from the
              - link "Cursor dashboard" [ref=f14e879] [cursor=pointer]:
                - /url: https://cursor.com/dashboard/team-content
              - text: . Admins can configure whether or not each rule is required for team members.
            - paragraph [ref=f14e880]: Team Rules work alongside other rule types and take precedence to ensure organizational standards are maintained across all projects. They provide a powerful way to ensure consistent coding standards, practices, and workflows across your entire team without requiring individual setup or configuration.
            - heading [level=3] [ref=f14e881]:
              - link "Copy link to managing-team-rules" [ref=f14e882] [cursor=pointer]:
                - /url: "#managing-team-rules"
                - generic [ref=f14e883]: Managing Team Rules
            - paragraph [ref=f14e891]: "Team administrators can create and manage rules directly from the Cursor dashboard:"
            - button "Open image in full screen" [ref=f14e892] [cursor=pointer]:
              - img "Empty team rules dashboard where team administrators can add new rules" [ref=f14e893]
            - paragraph [ref=f14e894]: "Once team rules are created, they automatically apply to all team members and are visible in the dashboard:"
            - button "Open image in full screen" [ref=f14e895] [cursor=pointer]:
              - img "Team rules dashboard showing a single team rule that will be enforced for all team members" [ref=f14e896]
            - heading [level=3] [ref=f14e897]:
              - link "Copy link to activation-and-enforcement" [ref=f14e898] [cursor=pointer]:
                - /url: "#activation-and-enforcement"
                - generic [ref=f14e899]: Activation and enforcement
            - list [ref=f14e907]:
              - listitem [ref=f14e908]:
                - strong [ref=f14e909]: Enable this rule immediately
                - text: ": When checked, the rule is active as soon as you create it. When unchecked, the rule is saved as a draft and does not apply until you enable it later."
              - listitem [ref=f14e910]:
                - strong [ref=f14e911]: Enforce this rule
                - text: ": When enabled, the rule is required for all team members and cannot be disabled in Customize. When not enforced, team members can toggle the rule off under"
                - strong [ref=f14e912]: Team Rules
                - text: in Customize.
            - alert [ref=f14e913]:
              - paragraph [ref=f14e917]:
                - text: By default, non‑enforced Team Rules can be disabled by users. Use
                - strong [ref=f14e918]: Enforce this rule
                - text: to prevent that.
            - heading [level=3] [ref=f14e919]:
              - link "Copy link to format-and-how-team-rules-are-applied" [ref=f14e920] [cursor=pointer]:
                - /url: "#format-and-how-team-rules-are-applied"
                - generic [ref=f14e921]: Format and how Team Rules are applied
            - list [ref=f14e929]:
              - listitem [ref=f14e930]:
                - strong [ref=f14e931]: Content
                - text: ": Team Rules are free‑form text. They do not use the folder structure of Project Rules."
              - listitem [ref=f14e932]:
                - strong [ref=f14e933]: Glob patterns
                - text: ": Team Rules support glob patterns for file-scoped application. When a glob pattern is set (e.g.,"
                - code [ref=f14e934]: "**/*.py"
                - text: ), the rule only applies when matching files are in context. Rules without a glob pattern apply to every conversation.
              - listitem [ref=f14e935]:
                - strong [ref=f14e936]: Where they apply
                - text: ": When a Team Rule is enabled (and not disabled by the user, unless enforced), it is included in the model context for Agent (Chat) across all repositories and projects for that team."
              - listitem [ref=f14e937]:
                - strong [ref=f14e938]: Precedence
                - text: ": Rules are applied in this order:"
                - strong [ref=f14e939]: Team Rules → Project Rules → User Rules
                - text: . All applicable rules are merged; earlier sources take precedence when guidance conflicts.
            - alert [ref=f14e940]:
              - paragraph [ref=f14e944]: Some teams use enforced rules as part of internal compliance workflows. While this is supported, AI guidance should not be your only security control.
            - heading [level=2] [ref=f14e945]:
              - link "Copy link to importing-rules-from-a-repository" [ref=f14e946] [cursor=pointer]:
                - /url: "#importing-rules-from-a-repository"
                - generic [ref=f14e947]: Importing rules from a repository
            - paragraph [ref=f14e955]:
              - text: Rules aren't imported on their own. To bring rules in from a GitHub repository, package them in a
              - link "plugin" [ref=f14e956] [cursor=pointer]:
                - /url: /docs/plugins
              - text: "and publish that plugin through a marketplace: import the repository in"
              - strong [ref=f14e957]: Customize
              - text: with
              - strong [ref=f14e958]: From GitHub Repository
              - text: (the repository needs a
              - code [ref=f14e959]: .cursor-plugin/marketplace.json
              - text: ), or add it as a
              - link "team marketplace" [ref=f14e960] [cursor=pointer]:
                - /url: /docs/plugins#add-a-team-marketplace
              - text: ", then"
              - link "install the plugin" [ref=f14e961] [cursor=pointer]:
                - /url: /docs/plugins#installing-plugins
              - text: . The rules arrive with the plugin and appear in Customize alongside your other rules.
            - heading [level=2] [ref=f14e962]:
              - link "Copy link to agentsmd" [ref=f14e963] [cursor=pointer]:
                - /url: "#agentsmd"
                - generic [ref=f14e964]: AGENTS.md
            - paragraph [ref=f14e972]:
              - code [ref=f14e973]: AGENTS.md
              - text: is a simple markdown file for defining agent instructions. Place it in your project root as an alternative to
              - code [ref=f14e974]: .cursor/rules
              - text: for straightforward use cases.
            - paragraph [ref=f14e975]:
              - text: Unlike Project Rules,
              - code [ref=f14e976]: AGENTS.md
              - text: is a plain markdown file without metadata or complex configurations. It's perfect for projects that need simple, readable instructions without the overhead of structured rules.
            - paragraph [ref=f14e977]: Cursor supports AGENTS.md in the project root and subdirectories.
            - generic [ref=f14e980]:
              - button [ref=f14e981] [cursor=pointer]
