    - main [ref=f59e384]:
      - generic [ref=f59e387]:
        - generic [ref=f59e388]:
          - generic [ref=f59e389]: Cloud Agents
          - generic [ref=f59e391]:
            - heading "Cloud Agents" [level=1] [ref=f59e392]
            - paragraph [ref=f59e396]:
              - text: Cloud agents use the same
              - link "agent fundamentals" [ref=f59e397] [cursor=pointer]:
                - /url: /learn/agents
              - text: "but run in isolated VMs in the cloud with full development environments instead of on your local machine. The development environment is similar to the setup on your laptop: cloned repos, installed dependencies, secrets, startup commands, and network access."
            - paragraph [ref=f59e398]: Effective development environments give agents full context on your codebase and organization, so they can test and verify their work.
            - heading [level=2] [ref=f59e399]:
              - link "Copy link to why-use-cloud-agents" [ref=f59e400] [cursor=pointer]:
                - /url: "#why-use-cloud-agents"
                - generic [ref=f59e401]: Why use Cloud Agents?
            - paragraph [ref=f59e409]: You can run as many agents as you want in parallel, and they do not require your local machine to be connected to the internet.
            - paragraph [ref=f59e410]:
              - text: Because they have access to their own virtual machine, cloud agents can build, test, and interact with the changed software. They can also use computers to control the desktop and browser. Cloud agents support
              - link "MCP servers" [ref=f59e411] [cursor=pointer]:
                - /url: /docs/mcp
              - text: ", giving them access to external tools and data sources like databases, APIs, and third-party services."
            - paragraph [ref=f59e412]: Cloud agents can also run in multi-repo environments. Use one when a task spans separate frontend, backend, infrastructure, or shared-library repositories. The agent can inspect the full workspace, make coordinated changes, and open pull requests in the repos it changes.
            - heading [level=2] [ref=f59e413]:
              - link "Copy link to how-to-access" [ref=f59e414] [cursor=pointer]:
                - /url: "#how-to-access"
                - generic [ref=f59e415]: How to access
            - alert [ref=f59e423]:
              - paragraph [ref=f59e427]:
                - text: Before anyone can start a cloud agent from a repository, a Cursor account admin needs to connect source control for the account. Set up
                - link "GitHub (Cloud and Enterprise Server)" [ref=f59e428] [cursor=pointer]:
                  - /url: /docs/integrations/github
                - text: ","
                - link "GitLab (Cloud and Self-Hosted)" [ref=f59e429] [cursor=pointer]:
                  - /url: /docs/integrations/gitlab
                - text: ","
                - link "Bitbucket Cloud" [ref=f59e430] [cursor=pointer]:
                  - /url: /docs/integrations/bitbucket
                - text: ", or"
                - link "Azure DevOps" [ref=f59e431] [cursor=pointer]:
                  - /url: /docs/integrations/azure-devops
                - text: . To start without a repository, use
                - link "Start from scratch" [ref=f59e432] [cursor=pointer]:
                  - /url: /docs/cloud-agent/setup#start-from-scratch
                - text: .
            - paragraph [ref=f59e433]: "You can kick off cloud agents from wherever you work:"
            - list [ref=f59e434]:
              - listitem [ref=f59e435]:
                - strong [ref=f59e436]: Cursor for iOS
                - text: ": Start and manage agents from the"
                - link "Cursor iOS app" [ref=f59e437] [cursor=pointer]:
                  - /url: /docs/cloud-agent/mobile
              - listitem [ref=f59e438]:
                - strong [ref=f59e439]: Cursor Web
                - text: ": Start and manage agents from"
                - link "cursor.com/agents" [ref=f59e440] [cursor=pointer]:
                  - /url: https://cursor.com/agents
                - text: on any device
              - listitem [ref=f59e441]:
                - strong [ref=f59e442]: Cursor Desktop
                - text: ": Select"
                - strong [ref=f59e443]: Cloud
                - text: in the dropdown under the agent input
              - listitem [ref=f59e444]:
                - strong [ref=f59e445]: Slack
                - text: ": Use the @cursor command to kick off an agent"
              - listitem [ref=f59e446]:
                - strong [ref=f59e447]: GitHub or Bitbucket
                - text: ": Comment"
                - code [ref=f59e448]: "@cursor"
                - text: on a GitHub PR or issue, or on a Bitbucket PR, to kick off an agent
              - listitem [ref=f59e449]:
                - strong [ref=f59e450]: Linear
                - text: ": Use the @cursor command to kick off an agent"
              - listitem [ref=f59e451]:
                - strong [ref=f59e452]: API
                - text: ": Use the API to kick off an agent"
            - alert [ref=f59e453]:
              - paragraph [ref=f59e457]:
                - text: "On"
                - strong [ref=f59e458]: Android
                - text: ", use"
                - link "cursor.com/agents" [ref=f59e459] [cursor=pointer]:
                  - /url: https://cursor.com/agents
                - text: in Chrome and tap
                - strong [ref=f59e460]: Install App
                - text: for a Progressive Web App (PWA). See
                - link "Cursor for iOS" [ref=f59e461] [cursor=pointer]:
                  - /url: /docs/cloud-agent/mobile
                - text: for the native iPhone and iPad app and more mobile options.
            - link [ref=f59e462] [cursor=pointer]:
              - /url: /docs/integrations/slack
              - paragraph [ref=f59e473]: Use Cursor in Slack
              - paragraph [ref=f59e475]: Learn more about setting up and using the Slack integration, including triggering agents and receiving notifications.
            - heading [level=2] [ref=f59e476]:
              - link "Copy link to how-it-works" [ref=f59e477] [cursor=pointer]:
                - /url: "#how-it-works"
                - generic [ref=f59e478]: How it works
            - heading [level=3] [ref=f59e486]:
              - link "Copy link to repository-provider-connection" [ref=f59e487] [cursor=pointer]:
                - /url: "#repository-provider-connection"
                - generic [ref=f59e488]: Repository provider connection
            - paragraph [ref=f59e496]: Cloud agents clone your repo from GitHub, GitLab, Azure DevOps Services, or Bitbucket Cloud and work on a separate branch, then push changes to your repo for handoff.
            - paragraph [ref=f59e497]: You need read-write privileges to your repo and any dependent repos or submodules.
            - heading [level=3] [ref=f59e498]:
              - link "Copy link to environments" [ref=f59e499] [cursor=pointer]:
                - /url: "#environments"
                - generic [ref=f59e500]: Environments
            - paragraph [ref=f59e508]: Agents are only as capable as the environments they run in. An agent that can write code but can't run tests, query services, or reach APIs cannot close the loop on its work.
            - paragraph [ref=f59e509]: "Not setting up a development environment for your cloud agents is like not giving your engineers a computer. This is why environment setup is the most important step to improve the effectiveness of cloud agents. It lets cloud agents work like engineers do: write code, test and verify work, and ship software."
            - paragraph [ref=f59e510]:
              - text: You can configure environments with agent-led setup, a saved snapshot, or a Dockerfile in
              - code [ref=f59e511]: .cursor/environment.json
              - text: . See
              - link "Cloud agent setup" [ref=f59e512] [cursor=pointer]:
                - /url: /docs/cloud-agent/setup
              - text: to get started.
              - link "Builds" [ref=f59e513] [cursor=pointer]:
                - /url: /docs/cloud-agent/builds
              - text: prepare each environment in the background so agents start with repositories and dependencies ready.
            - paragraph [ref=f59e514]:
              - text: The Cloud Agents dashboard shows which environment and Build an agent used, along with environment details and version history. On the agent page, hover over the repository name at the top of the page to inspect the environment used for that run. See
              - link "Cloud agent setup" [ref=f59e515] [cursor=pointer]:
                - /url: /docs/cloud-agent/setup
              - text: for configuration details.
            - heading [level=3] [ref=f59e516]:
              - link "Copy link to runtime-and-environment-controls" [ref=f59e517] [cursor=pointer]:
                - /url: "#runtime-and-environment-controls"
                - generic [ref=f59e518]: Runtime and environment controls
            - paragraph [ref=f59e526]: Cursor manages VM provisioning, isolation, snapshots, startup, artifacts, and capacity for every Cloud Agent. You can add secrets, restrict outbound domains, connect to private networks with Tailscale or a similar client, and use private connectivity for supported source control paths.
            - paragraph [ref=f59e527]:
              - text: See
              - link "Cloud Agent security and network" [ref=f59e528] [cursor=pointer]:
                - /url: /docs/cloud-agent/security-network
              - text: for the full set of environment and network controls. To run tool execution on hardware you manage, see
              - link "Self-Hosted Machines" [ref=f59e529] [cursor=pointer]:
                - /url: /docs/cloud-agent/self-hosted
              - text: .
            - heading [level=2] [ref=f59e530]:
              - link "Copy link to models" [ref=f59e531] [cursor=pointer]:
                - /url: "#models"
                - generic [ref=f59e532]: Models
            - paragraph [ref=f59e540]: Cloud Agents use a curated selection of models. You can select the context window size for supported models.
            - heading [level=2] [ref=f59e541]:
              - link "Copy link to mcp-support" [ref=f59e542] [cursor=pointer]:
                - /url: "#mcp-support"
                - generic [ref=f59e543]: MCP support
            - paragraph [ref=f59e551]:
              - text: Cloud agents can use
              - link "MCP (Model Context Protocol)" [ref=f59e552] [cursor=pointer]:
                - /url: /docs/mcp
              - text: servers configured for your team. Add and manage MCP servers through the MCP dropdown in
              - link "cursor.com/agents" [ref=f59e553] [cursor=pointer]:
                - /url: https://cursor.com/agents
              - text: .
            - paragraph [ref=f59e554]:
              - text: Both HTTP and stdio transports are supported. OAuth is supported for MCP servers that need it. See
              - link "Cloud Agent capabilities" [ref=f59e555] [cursor=pointer]:
                - /url: /docs/cloud-agent/capabilities
              - text: for setup details.
            - paragraph [ref=f59e556]:
              - text: Cloud Agents also include a built-in
              - link "Cursor Cloud MCP" [ref=f59e557] [cursor=pointer]:
                - /url: /docs/cloud-agent/capabilities#cursor-cloud-mcp
              - text: for run diagnostics, including transcripts, run events, environment details, and setup logs.
            - heading [level=2] [ref=f59e558]:
              - link "Copy link to hooks-support" [ref=f59e559] [cursor=pointer]:
                - /url: "#hooks-support"
                - generic [ref=f59e560]: Hooks support
            - paragraph [ref=f59e568]:
              - text: Cloud agents run command-based hooks from
              - code [ref=f59e569]: .cursor/hooks.json
              - text: in your repository. On Enterprise plans, they also run team hooks and enterprise-managed hooks.
            - paragraph [ref=f59e570]:
              - text: This keeps formatters, audit scripts, and policy checks active when work runs in the cloud. Supported hooks include tool and file hooks (
              - code [ref=f59e571]: preToolUse
              - text: ","
              - code [ref=f59e572]: beforeShellExecution
              - text: ","
              - code [ref=f59e573]: afterFileEdit
              - text: ), plus lifecycle hooks (
              - code [ref=f59e574]: beforeSubmitPrompt
              - text: ","
              - code [ref=f59e575]: subagentStart
              - text: /
              - code [ref=f59e576]: subagentStop
              - text: ","
              - code [ref=f59e577]: preCompact
              - text: ","
              - code [ref=f59e578]: afterAgentResponse
              - text: /
              - code [ref=f59e579]: afterAgentThought
              - text: ", and"
              - code [ref=f59e580]: stop
              - text: ).
            - paragraph [ref=f59e581]:
              - text: Hooks do not run during early exploratory turns in a read-only environment; they start once the agent has a writable environment. Some hooks are IDE-specific (Tab hooks,
              - code [ref=f59e582]: workspaceOpen
              - text: ). User-level hooks from
              - code [ref=f59e583]: ~/.cursor/hooks.json
              - text: are also not available since cloud VMs don't have access to your local home directory.
            - paragraph [ref=f59e584]:
              - text: See
              - 'link "Hooks: Cloud agent support" [ref=f59e585] [cursor=pointer]':
                - /url: /docs/hooks#cloud-agent-support
              - text: for the full support matrix and details.
            - heading [level=2] [ref=f59e586]:
              - link "Copy link to artifacts-and-remote-desktop-control" [ref=f59e587] [cursor=pointer]:
                - /url: "#artifacts-and-remote-desktop-control"
                - generic [ref=f59e588]: Artifacts and remote desktop control
            - paragraph [ref=f59e596]: Cloud agents produce merge-ready PRs with artifacts to demo their changes. You can also control the agent's remote desktop to use the modified software.
            - list [ref=f59e597]:
              - listitem [ref=f59e598]:
                - strong [ref=f59e599]: Artifacts
                - text: ": Agents produce screenshots, videos, and logs so you can see exactly what changed and how the agent verified its work."
              - listitem [ref=f59e600]:
                - strong [ref=f59e601]: Remote desktop control
                - text: ": Take control of the agent's desktop to test the software yourself in a full development environment without checking out the branch locally. Release control back to the agent for it to keep working."
            - paragraph [ref=f59e602]:
              - text: See
              - link "Cloud agent capabilities" [ref=f59e603] [cursor=pointer]:
                - /url: /docs/cloud-agent/capabilities
              - text: for details on artifacts, computer use, and remote desktop control.
            - heading [level=2] [ref=f59e604]:
              - link "Copy link to share-agents-with-your-team" [ref=f59e605] [cursor=pointer]:
                - /url: "#share-agents-with-your-team"
                - generic [ref=f59e606]: Share agents with your team
            - paragraph [ref=f59e614]: Send an agent's URL to a teammate and they can open the run to see the conversation, the code changes, and the artifacts the agent produced.
            - paragraph [ref=f59e615]:
              - text: "Agents are visible to members of the Cursor team they were started under. Cursor also verifies each viewer's repository access: to open a teammate's agent, connect your own source control account under"
