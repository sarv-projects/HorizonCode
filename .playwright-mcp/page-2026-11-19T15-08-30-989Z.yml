              - text: ", they're priced at API rates plus the"
              - link "Max Mode" [ref=f59e659] [cursor=pointer]:
                - /url: /help/ai-features/max-mode
              - text: upcharge against your included requests. You can select the context window size, and a larger context window can increase token usage and costs. You'll be asked to set a spend limit when you first start using them.
