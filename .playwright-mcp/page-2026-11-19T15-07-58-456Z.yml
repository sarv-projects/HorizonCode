              - paragraph [ref=f27e2206]:
                - text: The
                - code [ref=f27e2207]: followup_message
                - text: field enables loop-style flows where subagent completion triggers the next iteration. Follow-ups are subject to the same configurable loop limit as the
                - code [ref=f27e2208]: stop
                - text: hook (default 5, configurable via
                - code [ref=f27e2209]: loop_limit
                - text: ).
              - paragraph [ref=f27e2210]:
                - code [ref=f27e2211]: subagentStop
                - text: fires each time the subagent finishes, so a subagent that continues with a follow-up fires it again with
                - code [ref=f27e2212]: loop_count
                - text: increased by one. The subagent is done after a
                - code [ref=f27e2213]: subagentStop
                - text: call returns no
                - code [ref=f27e2214]: followup_message
                - text: or the loop limit is reached.
