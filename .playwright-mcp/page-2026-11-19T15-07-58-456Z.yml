                  - text: The optional
                  - code [ref=f27e2826]: followup_message
                  - text: is a string. When provided and non-empty, Cursor will automatically submit it as the next user message. This enables loop-style flows (e.g., iterate until a goal is met).
                - listitem [ref=f27e2827]:
                  - text: The
                  - code [ref=f27e2828]: loop_count
                  - text: field indicates how many times the stop hook has already triggered an automatic follow-up for this conversation (starts at 0). The default limit is 5 auto follow-ups per script, configurable via the
                  - code [ref=f27e2829]: loop_limit
                  - text: option. Set
                  - code [ref=f27e2830]: loop_limit
                  - text: to
                  - code [ref=f27e2831]: "null"
                  - text: to remove the cap. The same limit applies to
                  - code [ref=f27e2832]: subagentStop
                  - text: follow-ups.
