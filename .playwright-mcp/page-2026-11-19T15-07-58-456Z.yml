              - heading [level=2] [ref=f27e1504]:
                - link "Copy link to team-distribution" [ref=f27e1505] [cursor=pointer]:
                  - /url: "#team-distribution"
                  - generic [ref=f27e1506]: Team Distribution
              - paragraph [ref=f27e1514]: Hooks can be distributed to team members using project hooks (via version control), MDM tools, or Cursor's cloud distribution system.
              - heading [level=3] [ref=f27e1515]:
                - link "Copy link to project-hooks-version-control" [ref=f27e1516] [cursor=pointer]:
                  - /url: "#project-hooks-version-control"
                  - generic [ref=f27e1517]: Project Hooks (Version Control)
              - paragraph [ref=f27e1525]:
                - text: Project hooks are the simplest way to share hooks with your team. Place a
                - code [ref=f27e1526]: hooks.json
                - text: file at
                - code [ref=f27e1527]: <project-root>/.cursor/hooks.json
                - text: and commit it to your repository. When team members open the project in a trusted workspace, Cursor automatically loads and runs the project hooks.
              - paragraph [ref=f27e1528]: Cloud agents also load these project hooks when they work on your repository in the cloud.
              - paragraph [ref=f27e1529]: "Project hooks:"
              - list [ref=f27e1530]:
                - listitem [ref=f27e1531]: Are stored in version control alongside your code
                - listitem [ref=f27e1532]: Automatically load for all team members in trusted workspaces
                - listitem [ref=f27e1533]: Can be project-specific (e.g., enforce formatting standards for a particular codebase)
                - listitem [ref=f27e1534]: Require the workspace to be trusted to run (for security)
              - heading [level=3] [ref=f27e1535]:
                - link "Copy link to mdm-distribution" [ref=f27e1536] [cursor=pointer]:
                  - /url: "#mdm-distribution"
                  - generic [ref=f27e1537]: MDM Distribution
              - paragraph [ref=f27e1545]:
                - text: Distribute hooks across your organization using Mobile Device Management (MDM) tools. Place the
                - code [ref=f27e1546]: hooks.json
                - text: file and hook scripts in the target directories on each machine.
              - paragraph [ref=f27e1547]:
                - strong [ref=f27e1548]: User home directory
                - text: "(per-user distribution):"
              - list [ref=f27e1549]:
                - listitem [ref=f27e1550]:
                  - code [ref=f27e1551]: ~/.cursor/hooks.json
                - listitem [ref=f27e1552]:
                  - code [ref=f27e1553]: ~/.cursor/hooks/
                  - text: (for hook scripts)
              - paragraph [ref=f27e1554]:
                - strong [ref=f27e1555]: Global directories
                - text: "(system-wide distribution):"
              - list [ref=f27e1556]:
                - listitem [ref=f27e1557]:
                  - text: "macOS:"
                  - code [ref=f27e1558]: /Library/Application Support/Cursor/hooks.json
                - listitem [ref=f27e1559]:
                  - text: "Linux/WSL:"
                  - code [ref=f27e1560]: /etc/cursor/hooks.json
                - listitem [ref=f27e1561]:
                  - text: "Windows:"
                  - code [ref=f27e1562]: C:\\ProgramData\\Cursor\\hooks.json
              - paragraph [ref=f27e1563]: "Note: MDM-based distribution is fully managed by your organization. Cursor does not deploy or manage files through your MDM solution. Ensure your internal IT or security team handles configuration, deployment, and updates in accordance with your organization's policies."
              - heading [level=3] [ref=f27e1564]:
                - link "Copy link to cloud-distribution-enterprise-only" [ref=f27e1565] [cursor=pointer]:
                  - /url: "#cloud-distribution-enterprise-only"
                  - generic [ref=f27e1566]: Cloud Distribution (Enterprise Only)
              - paragraph [ref=f27e1574]:
                - text: Enterprise teams can use Cursor's native cloud distribution to automatically sync hooks to all team members. Configure hooks in the
                - link "web dashboard" [ref=f27e1575] [cursor=pointer]:
                  - /url: https://cursor.com/dashboard/team-content?section=hooks
                - text: . Cursor automatically delivers configured hooks to all client machines when team members log in.
              - paragraph [ref=f27e1576]: "Cloud distribution provides:"
              - list [ref=f27e1577]:
                - listitem [ref=f27e1578]: Automatic synchronization to all team members (every thirty minutes)
                - listitem [ref=f27e1579]: Operating system targeting for platform-specific hooks
                - listitem [ref=f27e1580]: Centralized management through the dashboard
              - paragraph [ref=f27e1581]:
                - text: Each dashboard hook runs one script or one prompt on one hook step. Dashboard hooks don't take per-hook options such as
                - code [ref=f27e1582]: failClosed
                - text: or
                - code [ref=f27e1583]: matcher
                - text: .
              - paragraph [ref=f27e1584]:
                - text: The desktop app writes each command hook to
                - code [ref=f27e1585]: ~/.cursor/managed/team_<team ID>/hooks/
                - text: and rewrites the folder on every sync. On Windows, a script name without a
                - code [ref=f27e1586]: .ps1
                - text: ","
                - code [ref=f27e1587]: .bat
                - text: ", or"
                - code [ref=f27e1588]: .cmd
                - text: extension gets
                - code [ref=f27e1589]: .ps1
                - text: added.
              - paragraph [ref=f27e1590]:
                - text: By default, the desktop app waits only a short time for hooks to load before it sends a prompt. Turn on
                - strong [ref=f27e1591]: Block until hooks are ready
                - text: in the dashboard's hook settings to make it wait with no timeout until enterprise, team, project, and user hooks have loaded, so they run on every prompt, including the first one after a restart.
              - paragraph [ref=f27e1592]: Enterprise administrators can create, edit, and manage team hooks from the dashboard without requiring access to individual machines.
              - paragraph [ref=f27e1593]:
                - link "Contact sales" [ref=f27e1594] [cursor=pointer]:
                  - /url: https://cursor.com/contact-sales?source=docs-hooks-cloud
                - text: to get Enterprise cloud hook distribution.
