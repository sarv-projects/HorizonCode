      - main [ref=f27e385]:
        - generic [ref=f27e388]:
          - generic [ref=f27e389]:
            - generic [ref=f27e390]: Customize
            - generic [ref=f27e392]:
              - heading "Hooks" [level=1] [ref=f27e393]
              - paragraph [ref=f27e394]:
                - text: Hooks let you observe, control, and extend the agent loop using custom scripts. Define hooks in
                - code [ref=f27e395]: hooks.json
                - text: files at the project or user level, or install them through plugins from
                - strong [ref=f27e396]: Customize
                - text: . Hooks are spawned processes that communicate over stdio using JSON in both directions. They run before or after defined stages of the agent loop and can observe, block, or modify behavior.
              - paragraph [ref=f27e399]: "With hooks, you can:"
              - list [ref=f27e400]:
                - listitem [ref=f27e401]: Run formatters after edits
                - listitem [ref=f27e402]: Add analytics for events
                - listitem [ref=f27e403]: Scan for PII or secrets
                - listitem [ref=f27e404]: Gate risky operations (e.g., SQL writes)
                - listitem [ref=f27e405]: Control subagent (Task tool) execution
                - listitem [ref=f27e406]: Inject context at session start
              - alert [ref=f27e407]:
                - paragraph [ref=f27e411]:
                  - text: Looking for ready-to-use integrations? See
                  - link "Partner Integrations" [ref=f27e412] [cursor=pointer]:
                    - /url: "#partner-integrations"
                  - text: for security, governance, and secrets management solutions from our ecosystem partners.
              - alert [ref=f27e413]:
                - paragraph [ref=f27e417]:
                  - text: Cursor supports loading hooks from third-party tools like Claude Code. See
                  - link "Third Party Hooks" [ref=f27e418] [cursor=pointer]:
                    - /url: /docs/reference/third-party-hooks
                  - text: for details on compatibility and configuration.
              - heading [level=2] [ref=f27e419]:
                - link "Copy link to hook-categories" [ref=f27e420] [cursor=pointer]:
                  - /url: "#hook-categories"
                  - generic [ref=f27e421]: Hook categories
              - paragraph [ref=f27e429]: "Hooks fall into three categories based on what triggers them:"
              - paragraph [ref=f27e430]:
                - strong [ref=f27e431]: Agent hooks (Agent Chat)
                - text: "fire during an agent session:"
              - list [ref=f27e432]:
                - listitem [ref=f27e433]:
                  - code [ref=f27e434]: sessionStart
                  - text: /
                  - code [ref=f27e435]: sessionEnd
                  - text: "- Session lifecycle management"
                - listitem [ref=f27e436]:
                  - code [ref=f27e437]: preToolUse
                  - text: /
                  - code [ref=f27e438]: postToolUse
                  - text: /
                  - code [ref=f27e439]: postToolUseFailure
                  - text: "- Generic tool use hooks (fires for all tools)"
                - listitem [ref=f27e440]:
                  - code [ref=f27e441]: subagentStart
                  - text: /
                  - code [ref=f27e442]: subagentStop
                  - text: "- Subagent (Task tool) lifecycle"
                - listitem [ref=f27e443]:
                  - code [ref=f27e444]: beforeShellExecution
                  - text: /
                  - code [ref=f27e445]: afterShellExecution
                  - text: "- Control shell commands"
                - listitem [ref=f27e446]:
                  - code [ref=f27e447]: beforeMCPExecution
                  - text: /
                  - code [ref=f27e448]: afterMCPExecution
                  - text: "- Control MCP tool usage"
                - listitem [ref=f27e449]:
                  - code [ref=f27e450]: beforeReadFile
                  - text: /
                  - code [ref=f27e451]: afterFileEdit
                  - text: "- Control file access and edits"
                - listitem [ref=f27e452]:
                  - code [ref=f27e453]: beforeSubmitPrompt
                  - text: "- Validate prompts before submission"
                - listitem [ref=f27e454]:
                  - code [ref=f27e455]: preCompact
                  - text: "- Observe context window compaction"
                - listitem [ref=f27e456]:
                  - code [ref=f27e457]: stop
                  - text: "- Handle agent completion"
                - listitem [ref=f27e458]:
                  - code [ref=f27e459]: afterAgentResponse
                  - text: /
                  - code [ref=f27e460]: afterAgentThought
                  - text: "- Track agent responses"
              - paragraph [ref=f27e461]:
                - strong [ref=f27e462]: Tab hooks (inline completions)
                - text: "fire for autonomous Tab operations:"
              - list [ref=f27e463]:
                - listitem [ref=f27e464]:
                  - code [ref=f27e465]: beforeTabFileRead
                  - text: "- Control file access for Tab completions"
                - listitem [ref=f27e466]:
                  - code [ref=f27e467]: afterTabFileEdit
                  - text: "- Post-process Tab edits"
              - paragraph [ref=f27e468]:
                - strong [ref=f27e469]: App lifecycle hooks
                - text: "fire outside any agent session:"
              - list [ref=f27e470]:
                - listitem [ref=f27e471]:
                  - code [ref=f27e472]: workspaceOpen
                  - text: "- Fires when Cursor opens a workspace and on every workspace folder change. Can return additional plugin paths to load for the current workspace."
              - paragraph [ref=f27e473]: These separate hook surfaces let you apply different policies to autonomous Tab operations, user-directed Agent operations, and workspace startup.
              - heading [level=2] [ref=f27e474]:
                - link "Copy link to cloud-agent-support" [ref=f27e475] [cursor=pointer]:
                  - /url: "#cloud-agent-support"
                  - generic [ref=f27e476]: Cloud agent support
              - paragraph [ref=f27e484]:
                - text: Cloud agents run command-based hooks from your repository. If you have hooks defined in
                - code [ref=f27e485]: .cursor/hooks.json
                - text: at the root of your project, cloud agents pick them up and run them during their work.
              - paragraph [ref=f27e486]:
                - text: In a
                - link "multi-repo environment" [ref=f27e487] [cursor=pointer]:
                  - /url: /docs/cloud-agent/setup#multi-repo-environments
                - text: ", each repo's"
                - code [ref=f27e488]: .cursor/hooks.json
                - text: runs from that repo's folder, and file hooks fire only for that repo's files.
              - paragraph [ref=f27e489]:
                - text: On Enterprise plans, cloud agents also run team hooks and enterprise-managed hooks configured through the
                - link "web dashboard" [ref=f27e490] [cursor=pointer]:
                  - /url: https://cursor.com/dashboard/team-content?section=hooks
                - text: .
              - paragraph [ref=f27e491]: Cloud agents sometimes begin in a read-only environment for early exploratory turns. Hooks do not run during those turns. They start once the agent has a writable environment.
              - heading [level=3] [ref=f27e492]:
                - link "Copy link to supported-hooks" [ref=f27e493] [cursor=pointer]:
                  - /url: "#supported-hooks"
                  - generic [ref=f27e494]: Supported hooks
              - paragraph [ref=f27e502]: "The following hooks run in cloud agents:"
              - table [ref=f27e504]:
                - rowgroup [ref=f27e505]:
                  - row [ref=f27e506]:
                    - columnheader "Hook" [ref=f27e507]
                    - columnheader "Supported" [ref=f27e508]
                - rowgroup [ref=f27e509]:
                  - row [ref=f27e510]:
                    - cell [ref=f27e511]:
                      - code [ref=f27e512]: beforeShellExecution
                    - cell "Yes" [ref=f27e513]
                  - row [ref=f27e514]:
                    - cell [ref=f27e515]:
                      - code [ref=f27e516]: afterShellExecution
                    - cell "Yes" [ref=f27e517]
                  - row [ref=f27e518]:
                    - cell [ref=f27e519]:
                      - code [ref=f27e520]: beforeReadFile
                    - cell "Yes" [ref=f27e521]
                  - row [ref=f27e522]:
                    - cell [ref=f27e523]:
                      - code [ref=f27e524]: afterFileEdit
                    - cell "Yes" [ref=f27e525]
                  - row [ref=f27e526]:
                    - cell [ref=f27e527]:
                      - code [ref=f27e528]: preToolUse
                    - cell "Yes" [ref=f27e529]
                  - row [ref=f27e530]:
                    - cell [ref=f27e531]:
                      - code [ref=f27e532]: postToolUse
                    - cell "Yes" [ref=f27e533]
                  - row [ref=f27e534]:
                    - cell [ref=f27e535]:
                      - code [ref=f27e536]: postToolUseFailure
                    - cell "Yes" [ref=f27e537]
                  - row [ref=f27e538]:
                    - cell [ref=f27e539]:
                      - code [ref=f27e540]: subagentStart
                    - cell "Yes" [ref=f27e541]
                  - row [ref=f27e542]:
                    - cell [ref=f27e543]:
                      - code [ref=f27e544]: subagentStop
                    - cell "Yes" [ref=f27e545]
                  - row [ref=f27e546]:
                    - cell [ref=f27e547]:
                      - code [ref=f27e548]: beforeSubmitPrompt
                    - cell "Yes" [ref=f27e549]
                  - row [ref=f27e550]:
                    - cell [ref=f27e551]:
                      - code [ref=f27e552]: preCompact
                    - cell "Yes" [ref=f27e553]
                  - row [ref=f27e554]:
                    - cell [ref=f27e555]:
                      - code [ref=f27e556]: afterAgentResponse
                    - cell "Yes" [ref=f27e557]
                  - row [ref=f27e558]:
                    - cell [ref=f27e559]:
                      - code [ref=f27e560]: afterAgentThought
                    - cell "Yes" [ref=f27e561]
                  - row [ref=f27e562]:
                    - cell [ref=f27e563]:
                      - code [ref=f27e564]: stop
                    - cell "Yes" [ref=f27e565]
              - paragraph [ref=f27e566]:
                - text: HTTP MCP servers run on Cursor's backend instead of the agent's VM. For their tools,
                - code [ref=f27e567]: preToolUse
                - text: and
                - code [ref=f27e568]: postToolUse
                - text: fire with
                - code [ref=f27e569]: tool_name
                - text: set to
                - code [ref=f27e570]: MCP:<tool_name>
                - text: ", with these limits:"
              - list [ref=f27e571]:
                - listitem [ref=f27e572]:
                  - code [ref=f27e573]: preToolUse
                  - text: can deny the call, but Cursor ignores
                  - code [ref=f27e574]: updated_input
                  - text: .
                - listitem [ref=f27e575]:
                  - code [ref=f27e576]: postToolUse
                  - text: receives
                  - code [ref=f27e577]: "{\"redacted\": true}"
                  - text: (with
                  - code [ref=f27e578]: isError
                  - text: when known) as
                  - code [ref=f27e579]: tool_output
                  - text: instead of the tool result, and can't replace the result with
                  - code [ref=f27e580]: updated_mcp_tool_output
                  - text: .
              - heading [level=3] [ref=f27e581]:
                - link "Copy link to hooks-not-available-in-cloud-agents" [ref=f27e582] [cursor=pointer]:
                  - /url: "#hooks-not-available-in-cloud-agents"
                  - generic [ref=f27e583]: Hooks not available in cloud agents
              - paragraph [ref=f27e591]: "Some hooks don't apply to cloud agents due to differences in the execution environment:"
              - table [ref=f27e593]:
                - rowgroup [ref=f27e594]:
                  - row [ref=f27e595]:
                    - columnheader "Hook" [ref=f27e596]
                    - columnheader "Reason" [ref=f27e597]
                - rowgroup [ref=f27e598]:
                  - row [ref=f27e599]:
                    - cell [ref=f27e600]:
                      - code [ref=f27e601]: sessionStart
                    - cell [ref=f27e602]:
                      - text: Deferred while cloud agents can still start in a read-only environment. Hooks don't load there, so a cloud
                      - code [ref=f27e603]: sessionStart
                      - text: would fire too late (after the first write) rather than at true session start.
                  - row [ref=f27e604]:
                    - cell [ref=f27e605]:
                      - code [ref=f27e606]: sessionEnd
                    - cell [ref=f27e607]:
                      - text: Cloud agents have no editor-lifetime session boundary.
                      - code [ref=f27e608]: sessionEnd
                      - text: is tied to the IDE session, not a cloud agent chat.
                  - row [ref=f27e609]:
                    - cell [ref=f27e610]:
                      - code [ref=f27e611]: beforeMCPExecution
                      - text: /
                      - code [ref=f27e612]: afterMCPExecution
                    - cell "Deferred while cloud agents can still start in a read-only environment, where hooks don't load and MCP hook timing is unclear." [ref=f27e613]
                  - row [ref=f27e614]:
                    - cell [ref=f27e615]:
                      - code [ref=f27e616]: beforeTabFileRead
                      - text: /
                      - code [ref=f27e617]: afterTabFileEdit
                    - cell "Tab completions are an IDE feature and don't run in cloud agents." [ref=f27e618]
                  - row [ref=f27e619]:
                    - cell [ref=f27e620]:
                      - code [ref=f27e621]: workspaceOpen
                    - cell "This is an IDE lifecycle hook and doesn't apply to cloud agents." [ref=f27e622]
