            - list [ref=f56e1182]:
              - listitem [ref=f56e1183]:
                - paragraph [ref=f56e1184]:
                  - strong [ref=f56e1185]: JetBrains IDEs
                  - text: — Connect IntelliJ IDEA, WebStorm, PyCharm, or other JetBrains IDEs to Cursor's agent. See the
                  - link "JetBrains integration guide" [ref=f56e1186] [cursor=pointer]:
                    - /url: /docs/integrations/jetbrains
                  - text: for setup instructions.
              - listitem [ref=f56e1187]:
                - paragraph [ref=f56e1188]:
                  - strong [ref=f56e1189]: Neovim (avante.nvim)
                  - text: — Use
                  - link "avante.nvim" [ref=f56e1190] [cursor=pointer]:
                    - /url: https://github.com/yetone/avante.nvim
                  - text: to connect Neovim to Cursor's agent through ACP. See
                  - link "Neovim setup" [ref=f56e1191] [cursor=pointer]:
                    - /url: "#neovim-avantenvim"
                  - text: below.
              - listitem [ref=f56e1192]:
                - paragraph [ref=f56e1193]:
                  - strong [ref=f56e1194]: Zed
                  - text: — Integrate with Zed's modern editor by spawning
                  - code [ref=f56e1195]: agent acp
                  - text: and communicating over stdio. Zed extensions can implement the ACP client protocol to route AI requests to Cursor.
              - listitem [ref=f56e1196]:
                - paragraph [ref=f56e1197]:
                  - strong [ref=f56e1198]: Custom editors
                  - text: — Any editor with extension support can implement an ACP client. Spawn the agent process, send JSON-RPC messages over stdio, and handle responses in your editor's UI.
