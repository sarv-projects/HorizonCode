              - paragraph [ref=f24e929]: "The model picker, including Auto, applies to the parent agent. A subagent can run a different model:"
              - list [ref=f24e930]:
                - listitem [ref=f24e931]: Built-in subagents (Explore, Browser) pick a model for the subtask.
                - listitem [ref=f24e932]:
                  - text: Custom subagents use
                  - code [ref=f24e933]: inherit
                  - text: or the
                  - code [ref=f24e934]: model
                  - text: field in frontmatter.
                - listitem [ref=f24e935]: The parent agent can name a model when it launches a subagent.
              - paragraph [ref=f24e936]:
                - text: Each request bills at the list price of the model that ran. A named third-party model bills as
                - link "third-party usage" [ref=f24e937] [cursor=pointer]:
                  - /url: /docs/models-and-pricing#third-party-models
                - text: ", from prepaid credit on The X Subscription or from the Other Models pool on legacy Cursor plans, including when the parent chat is on Auto, Grok, or Composer. On Teams and Enterprise, eligible third-party requests also incur the"
                - link "Cursor Token Rate" [ref=f24e938] [cursor=pointer]:
                  - /url: /docs/models-and-pricing#cursor-token-rate
                - text: . Third-party models are exempt when their cache-read price is strictly below $0.10 per million tokens across every pricing tier.
              - paragraph [ref=f24e939]:
                - text: The subagent task card shows which model ran. The
                - link "usage dashboard" [ref=f24e940] [cursor=pointer]:
                  - /url: https://cursor.com/dashboard/usage
                - text: lists that model on the matching usage row.
              - paragraph [ref=f24e941]:
