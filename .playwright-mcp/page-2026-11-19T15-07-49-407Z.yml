              - heading [level=2] [ref=f24e1313]:
                - link "Copy link to best-practices" [ref=f24e1314] [cursor=pointer]:
                  - /url: "#best-practices"
                  - generic [ref=f24e1315]: Best practices
              - list [ref=f24e1323]:
                - listitem [ref=f24e1324]:
                  - strong [ref=f24e1325]: Write focused subagents
                  - text: — Each subagent should have a single, clear responsibility. Avoid generic "helper" agents.
                - listitem [ref=f24e1326]:
                  - strong [ref=f24e1327]: Invest in descriptions
                  - text: — The
                  - code [ref=f24e1328]: description
                  - text: field determines when Agent delegates to your subagent. Spend time refining it. Test by making prompts and checking if the right subagent gets triggered.
                - listitem [ref=f24e1329]:
                  - strong [ref=f24e1330]: Keep prompts concise
                  - text: — Long, rambling prompts dilute focus. Be specific and direct.
                - listitem [ref=f24e1331]:
                  - strong [ref=f24e1332]: Add subagents to version control
                  - text: — Check
                  - code [ref=f24e1333]: .cursor/agents/
                  - text: into your repository so the team benefits.
                - listitem [ref=f24e1334]:
                  - strong [ref=f24e1335]: Start with Agent-generated agents
                  - text: — Let Agent help you draft the initial configuration, then customize.
                - listitem [ref=f24e1336]:
                  - strong [ref=f24e1337]: Use hooks for file output
                  - text: — If you need subagents to produce structured output files, consider using
                  - link "hooks" [ref=f24e1338] [cursor=pointer]:
                    - /url: /docs/hooks
                  - text: to process and save their results consistently.
              - heading [level=3] [ref=f24e1339]:
                - link "Copy link to anti-patterns-to-avoid" [ref=f24e1340] [cursor=pointer]:
                  - /url: "#anti-patterns-to-avoid"
                  - generic [ref=f24e1341]: Anti-patterns to avoid
              - alert [ref=f24e1349]:
                - paragraph [ref=f24e1353]:
                  - strong [ref=f24e1354]: Don't create dozens of generic subagents.
                  - text: Having 50+ subagents with vague instructions like "helps with coding" is ineffective. Agent won't know when to use them, and you'll waste time maintaining them.
              - list [ref=f24e1355]:
                - listitem [ref=f24e1356]:
                  - strong [ref=f24e1357]: Vague descriptions
                  - text: "— \"Use for general tasks\" gives Agent no signal about when to delegate. Be specific: \"Use when implementing authentication flows with OAuth providers.\""
                - listitem [ref=f24e1358]:
                  - strong [ref=f24e1359]: Overly long prompts
                  - text: — A 2,000-word prompt doesn't make a subagent smarter. It makes it slower and harder to maintain.
                - listitem [ref=f24e1360]:
                  - strong [ref=f24e1361]: Duplicating slash commands
                  - text: — If a task is single-purpose and doesn't need context isolation, use a
                  - link "skill" [ref=f24e1362] [cursor=pointer]:
                    - /url: /docs/skills
                  - text: or
                  - link "command" [ref=f24e1363] [cursor=pointer]:
                    - /url: /docs/customize-cursor#extension-components
                  - text: instead.
                - listitem [ref=f24e1364]:
                  - strong [ref=f24e1365]: Too many subagents
                  - text: — Start with 2-3 focused subagents. Add more only when you have clear, distinct use cases.
              - heading [level=2] [ref=f24e1366]:
                - link "Copy link to managing-subagents" [ref=f24e1367] [cursor=pointer]:
                  - /url: "#managing-subagents"
                  - generic [ref=f24e1368]: Managing subagents
              - heading [level=3] [ref=f24e1376]:
                - link "Copy link to creating-subagents" [ref=f24e1377] [cursor=pointer]:
