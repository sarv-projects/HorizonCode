      - main [ref=f24e384]:
        - generic [ref=f24e387]:
          - generic [ref=f24e388]:
            - generic [ref=f24e389]: Customize
            - generic [ref=f24e391]:
              - heading "Subagents" [level=1] [ref=f24e392]
              - paragraph [ref=f24e393]: Subagents are specialized AI assistants that Cursor's agent can delegate tasks to. Each subagent operates in its own context window, handles specific types of work, and returns its result to the parent agent. Use subagents to break down complex tasks, do work in parallel, and preserve context in the main conversation.
              - paragraph [ref=f24e394]:
                - text: You can use subagents in the editor, CLI, and
                - link "Cloud Agents" [ref=f24e395] [cursor=pointer]:
                  - /url: /docs/cloud-agent
                - text: .
              - generic [ref=f24e396]:
                - generic [ref=f24e397]:
                  - paragraph [ref=f24e403]: Context isolation
                  - paragraph [ref=f24e405]: Each subagent has its own context window. Long research or exploration tasks don't consume space in your main conversation.
                - generic [ref=f24e406]:
                  - paragraph [ref=f24e412]: Parallel execution
                  - paragraph [ref=f24e414]: Launch multiple subagents simultaneously. Work on different parts of your codebase without waiting for sequential completion.
                - generic [ref=f24e415]:
                  - paragraph [ref=f24e425]: Specialized expertise
                  - paragraph [ref=f24e427]: Configure subagents with custom prompts, tool access, and models for domain-specific tasks.
                - generic [ref=f24e428]:
                  - paragraph [ref=f24e435]: Reusability
                  - paragraph [ref=f24e437]: Define custom subagents and use them across projects.
              - heading [level=2] [ref=f24e438]:
                - link "Copy link to how-subagents-work" [ref=f24e439] [cursor=pointer]:
                  - /url: "#how-subagents-work"
                  - generic [ref=f24e440]: How subagents work
              - paragraph [ref=f24e448]: When Agent encounters a complex task, it can launch a subagent automatically. The subagent receives a prompt with all necessary context, works autonomously, and returns a final message with its results.
              - paragraph [ref=f24e449]: Subagents start with a clean context. The parent agent includes relevant information in the prompt since subagents don't have access to prior conversation history.
              - heading [level=3] [ref=f24e450]:
                - link "Copy link to foreground-vs-background" [ref=f24e451] [cursor=pointer]:
                  - /url: "#foreground-vs-background"
                  - generic [ref=f24e452]: Foreground vs background
              - paragraph [ref=f24e460]: "Subagents run in one of two modes:"
              - table [ref=f24e463]:
                - rowgroup [ref=f24e464]:
                  - row [ref=f24e465]:
                    - columnheader "Mode" [ref=f24e466]
                    - columnheader "Behavior" [ref=f24e467]
                    - columnheader "Best for" [ref=f24e468]
                - rowgroup [ref=f24e469]:
                  - row [ref=f24e470]:
                    - cell [ref=f24e471]:
                      - strong [ref=f24e472]: Foreground
                    - cell "Blocks until the subagent completes. Returns the result immediately." [ref=f24e473]
                    - cell "Sequential tasks where you need the output." [ref=f24e474]
                  - row [ref=f24e475]:
                    - cell [ref=f24e476]:
                      - strong [ref=f24e477]: Background
                    - cell "Returns immediately. The subagent works independently." [ref=f24e478]
                    - cell "Long-running tasks or parallel workstreams." [ref=f24e479]
              - heading [level=2] [ref=f24e480]:
                - link "Copy link to built-in-subagents" [ref=f24e481] [cursor=pointer]:
                  - /url: "#built-in-subagents"
                  - generic [ref=f24e482]: Built-in subagents
              - paragraph [ref=f24e490]: Cursor includes two built-in subagents that handle context-heavy operations automatically. These subagents were designed based on analysis of agent conversations where context window limits were hit.
              - table [ref=f24e493]:
                - rowgroup [ref=f24e494]:
                  - row [ref=f24e495]:
                    - columnheader "Subagent" [ref=f24e496]
                    - columnheader "Purpose" [ref=f24e497]
                    - columnheader "Why it's a subagent" [ref=f24e498]
                - rowgroup [ref=f24e499]:
                  - row [ref=f24e500]:
                    - cell [ref=f24e501]:
                      - strong [ref=f24e502]: Explore
                    - cell "Searches and analyzes codebases" [ref=f24e503]
                    - cell "Codebase exploration generates large intermediate output that would bloat the main context. Uses a faster model to run many parallel searches." [ref=f24e504]
                  - row [ref=f24e505]:
                    - cell [ref=f24e506]:
                      - strong [ref=f24e507]: Browser
                    - cell "Controls browser via MCP tools" [ref=f24e508]
                    - cell "Browser interactions produce noisy DOM snapshots and screenshots. The subagent filters this down to relevant results." [ref=f24e509]
              - heading [level=3] [ref=f24e510]:
                - link "Copy link to why-these-subagents-exist" [ref=f24e511] [cursor=pointer]:
                  - /url: "#why-these-subagents-exist"
                  - generic [ref=f24e512]: Why these subagents exist
              - paragraph [ref=f24e520]: "These operations share common traits: they generate noisy intermediate output, benefit from specialized prompts and tools, and can consume significant context. Running them as subagents solves several problems:"
              - list [ref=f24e521]:
                - listitem [ref=f24e522]:
                  - strong [ref=f24e523]: Context isolation
                  - text: — Intermediate output stays in the subagent. The parent only sees the final summary.
                - listitem [ref=f24e524]:
                  - strong [ref=f24e525]: Model flexibility
                  - text: — The explore subagent uses a faster model by default. This enables running 10 parallel searches in the time a single main-agent search would take.
                - listitem [ref=f24e526]:
                  - strong [ref=f24e527]: Specialized configuration
                  - text: — Each subagent has prompts and tool access tuned for its specific task.
                - listitem [ref=f24e528]:
                  - strong [ref=f24e529]: Cost efficiency
                  - text: — Faster models cost less. Isolating token-heavy work in subagents with appropriate model choices reduces overall cost.
              - paragraph [ref=f24e530]: You don't need to configure these subagents. Agent uses them automatically when appropriate.
              - heading [level=2] [ref=f24e531]:
                - link "Copy link to when-to-use-subagents" [ref=f24e532] [cursor=pointer]:
                  - /url: "#when-to-use-subagents"
                  - generic [ref=f24e533]: When to use subagents
              - table [ref=f24e543]:
                - rowgroup [ref=f24e544]:
                  - row [ref=f24e545]:
                    - columnheader "Use subagents when..." [ref=f24e546]
                    - columnheader "Use skills when..." [ref=f24e547]
                - rowgroup [ref=f24e548]:
                  - row [ref=f24e549]:
                    - cell "You need context isolation for long research tasks" [ref=f24e550]
                    - cell "The task is single-purpose (generate changelog, format)" [ref=f24e551]
                  - row [ref=f24e552]:
                    - cell "Running multiple workstreams in parallel" [ref=f24e553]
                    - cell "You want a quick, repeatable action" [ref=f24e554]
                  - row [ref=f24e555]:
                    - cell "The task requires specialized expertise across many steps" [ref=f24e556]
                    - cell "The task completes in one shot" [ref=f24e557]
                  - row [ref=f24e558]:
                    - cell "You want an independent verification of work" [ref=f24e559]
                    - cell "You don't need a separate context window" [ref=f24e560]
              - alert [ref=f24e561]:
                - paragraph [ref=f24e565]:
                  - text: If you find yourself creating a subagent for a simple, single-purpose task like "generate a changelog" or "format imports," consider using a
                  - link "skill" [ref=f24e566] [cursor=pointer]:
                    - /url: /docs/skills
                  - text: instead.
              - heading [level=2] [ref=f24e567]:
                - link "Copy link to quick-start" [ref=f24e568] [cursor=pointer]:
                  - /url: "#quick-start"
                  - generic [ref=f24e569]: Quick start
              - paragraph [ref=f24e577]: "Agent automatically uses subagents when appropriate. You can also create a custom subagent by asking Agent:"
              - generic [ref=f24e580]:
                - paragraph [ref=f24e581]: Create a subagent file at .cursor/agents/verifier.md with YAML frontmatter (name, description) followed by the prompt. The verifier subagent should validate completed work, check that implementations are functional, run tests, and report what passed vs what's incomplete.
                - link "Cursor Logo Try in Cursor" [ref=f24e582] [cursor=pointer]:
                  - /url: cursor://anysphere.cursor-deeplink/prompt?text=Create%20a%20subagent%20file%20at%20.cursor%2Fagents%2Fverifier.md%20with%20YAML%20frontmatter%20(name%2C%20description)%20followed%20by%20the%20prompt.%20The%20verifier%20subagent%20should%20validate%20completed%20work%2C%20check%20that%20implementations%20are%20functional%2C%20run%20tests%2C%20and%20report%20what%20passed%20vs%20what's%20incomplete.
                  - img "Cursor Logo"
                  - generic [ref=f24e583]: Try in Cursor
              - paragraph [ref=f24e584]: For more control, create custom subagents manually in your project or user directory.
              - heading [level=2] [ref=f24e585]:
                - link "Copy link to custom-subagents" [ref=f24e586] [cursor=pointer]:
                  - /url: "#custom-subagents"
                  - generic [ref=f24e587]: Custom subagents
              - paragraph [ref=f24e595]: Define custom subagents to encode specialized knowledge, enforce team standards, or automate repetitive workflows.
