                - listitem [ref=f24e967]: Custom subagent descriptions in your project
                - listitem [ref=f24e968]: Current context and available tools
              - paragraph [ref=f24e969]: Include phrases like "use proactively" or "always use for" in your description field to encourage automatic delegation.
              - heading [level=3] [ref=f24e970]:
                - link "Copy link to explicit-invocation" [ref=f24e971] [cursor=pointer]:
                  - /url: "#explicit-invocation"
                  - generic [ref=f24e972]: Explicit invocation
              - paragraph [ref=f24e980]:
                - text: Request a specific subagent by using the
                - code [ref=f24e981]: /name
                - text: "syntax in your prompt:"
              - generic [ref=f24e984]:
                - button [ref=f24e985] [cursor=pointer]
                - code [ref=f24e991]:
                  - generic [ref=f24e992]: "> /verifier confirm the auth flow is complete"
                  - generic [ref=f24e993]: "> /debugger investigate this error"
                  - generic [ref=f24e994]: "> /security-auditor review the payment module"
              - paragraph [ref=f24e995]: "You can also invoke subagents by mentioning them naturally:"
              - generic [ref=f24e998]:
                - button [ref=f24e999] [cursor=pointer]
                - code [ref=f24e1005]:
                  - generic [ref=f24e1006]: "> Use the verifier subagent to confirm the auth flow is complete"
                  - generic [ref=f24e1007]: "> Have the debugger subagent investigate this error"
                  - generic [ref=f24e1008]: "> Run the security-auditor subagent on the payment module"
              - heading [level=3] [ref=f24e1009]:
                - link "Copy link to parallel-execution" [ref=f24e1010] [cursor=pointer]:
                  - /url: "#parallel-execution"
                  - generic [ref=f24e1011]: Parallel execution
              - paragraph [ref=f24e1019]: "Launch multiple subagents concurrently for maximum throughput:"
              - generic [ref=f24e1022]:
                - button [ref=f24e1023] [cursor=pointer]
                - code [ref=f24e1029]:
                  - generic [ref=f24e1030]: "> Review the API changes and update the documentation in parallel"
              - paragraph [ref=f24e1031]: Agent sends multiple Task tool calls in a single message, so subagents run simultaneously.
              - heading [level=3] [ref=f24e1032]:
                - link "Copy link to isolated-project-copies" [ref=f24e1033] [cursor=pointer]:
                  - /url: "#isolated-project-copies"
                  - generic [ref=f24e1034]: Isolated project copies
              - paragraph [ref=f24e1042]: "Subagents share the parent agent's checkout by default. When several subagents edit files at once, they can overwrite each other's changes. Ask for isolation and each subagent runs in its own copy of the project:"
              - generic [ref=f24e1045]:
                - button [ref=f24e1046] [cursor=pointer]
                - code [ref=f24e1052]:
                  - generic [ref=f24e1053]: "> Run a swarm of subagents to fix these five flaky tests, each in its own environment"
              - paragraph [ref=f24e1054]: "Each subagent gets its own environment with its own branch: an isolated Git worktree with a separate working directory on the same machine, or its own cloud environment with a dedicated VM and clone of the repository. Changes stay on each subagent's branch until the parent agent merges the results."
              - paragraph [ref=f24e1055]:
                - text: This is subagent-level isolation within one session. To isolate a whole agent instead, run it in a
                - link "worktree" [ref=f24e1056] [cursor=pointer]:
                  - /url: /docs/configuration/worktrees
                - text: ", or hand the task to a"
                - link "cloud subagent" [ref=f24e1057] [cursor=pointer]:
                  - /url: "#cloud-subagents"
                - text: .
              - heading [level=2] [ref=f24e1058]:
                - link "Copy link to cloud-subagents" [ref=f24e1059] [cursor=pointer]:
                  - /url: "#cloud-subagents"
                  - generic [ref=f24e1060]: Cloud subagents
              - paragraph [ref=f24e1068]:
                - text: From a local agent session, you can hand off work to a cloud subagent that runs on its own VM and branch. Your local workspace stays clean and responsive while long-running or parallel work happens in the cloud. The parent agent keeps running locally or in the cloud without interruption. Cloud subagents run from the
                - link "Agents Window" [ref=f24e1069] [cursor=pointer]:
                  - /url: /docs/agent/agents-window
                - text: in the Cursor desktop app.
              - heading [level=3] [ref=f24e1073]:
                - link "Copy link to start-a-cloud-subagent-with-in-cloud" [ref=f24e1074] [cursor=pointer]:
                  - /url: "#start-a-cloud-subagent-with-in-cloud"
                  - generic [ref=f24e1075]: Start a cloud subagent with /in-cloud
              - paragraph [ref=f24e1083]:
                - text: Type
                - code [ref=f24e1084]: /in-cloud
                - text: and the next task you submit runs as a cloud subagent. It spins up its own VM and branch to work on the task.
              - paragraph [ref=f24e1085]: This is useful for isolating long-running or parallel work, such as fixing CI, investigating an issue, or exploring a codebase while you keep working locally.
              - heading [level=3] [ref=f24e1086]:
                - link "Copy link to put-a-pr-on-autopilot-with-autopilot" [ref=f24e1087] [cursor=pointer]:
                  - /url: "#put-a-pr-on-autopilot-with-autopilot"
                  - generic [ref=f24e1088]: Put a PR on autopilot with /autopilot
              - paragraph [ref=f24e1096]:
                - text: Ask a cloud subagent to take over a pull request with
                - code [ref=f24e1097]: /autopilot
                - text: or by clicking the quick-action pill. The cloud agent iterates remotely to prepare the PR for merge without tying up your local session.
              - paragraph [ref=f24e1098]:
                - text: Cloud subagents use the
                - link "environment" [ref=f24e1099] [cursor=pointer]:
                  - /url: /docs/cloud-agent/setup
                - text: configured for your repo and follow the same model and capability rules as other
                - link "Cloud Agents" [ref=f24e1100] [cursor=pointer]:
                  - /url: /docs/cloud-agent
                - text: . Because they run on a cloud VM, their
                - link "MCP servers" [ref=f24e1101] [cursor=pointer]:
                  - /url: /docs/cloud-agent/capabilities#mcp-tools
                - text: come from your team's configuration at
                - link "cursor.com/agents" [ref=f24e1102] [cursor=pointer]:
                  - /url: https://cursor.com/agents
                - text: ", not from your local session."
              - heading [level=2] [ref=f24e1103]:
                - link "Copy link to resuming-subagents" [ref=f24e1104] [cursor=pointer]:
                  - /url: "#resuming-subagents"
                  - generic [ref=f24e1105]: Resuming subagents
              - paragraph [ref=f24e1113]: Subagents can be resumed to continue previous conversations. This is useful for long-running tasks that span multiple invocations.
              - paragraph [ref=f24e1114]: "Each subagent execution returns an agent ID. Pass this ID to resume the subagent with full context preserved:"
              - generic [ref=f24e1117]:
                - button [ref=f24e1118] [cursor=pointer]
                - code [ref=f24e1124]:
                  - generic [ref=f24e1125]: "> Resume agent abc123 and analyze the remaining test failures"
              - alert [ref=f24e1126]:
                - paragraph [ref=f24e1130]: Background subagents write their state as they run. You can resume a subagent after it completes to continue the conversation with preserved context.
              - heading [level=2] [ref=f24e1131]:
                - link "Copy link to common-patterns" [ref=f24e1132] [cursor=pointer]:
                  - /url: "#common-patterns"
                  - generic [ref=f24e1133]: Common patterns
              - heading [level=3] [ref=f24e1141]:
                - link "Copy link to verification-agent" [ref=f24e1142] [cursor=pointer]:
                  - /url: "#verification-agent"
                  - generic [ref=f24e1143]: Verification agent
              - paragraph [ref=f24e1151]: A verification agent independently validates whether claimed work was actually completed. This addresses a common issue where AI marks tasks as done but implementations are incomplete or broken.
              - generic [ref=f24e1154]:
                - button [ref=f24e1155] [cursor=pointer]
                - code [ref=f24e1161]:
                  - generic [ref=f24e1162]: "---"
                  - generic [ref=f24e1163]: "name: verifier"
                  - generic [ref=f24e1164]: "description: Validates completed work. Use after tasks are marked done to confirm implementations are functional."
                  - generic [ref=f24e1165]: "---"
                  - generic [ref=f24e1167]: You are a skeptical validator. Your job is to verify that work claimed as complete actually works.
                  - generic [ref=f24e1169]: "When invoked:"
                  - generic [ref=f24e1170]: 1. Identify what was claimed to be completed
                  - generic [ref=f24e1171]: 2. Check that the implementation exists and is functional
                  - generic [ref=f24e1172]: 3. Run relevant tests or verification steps
                  - generic [ref=f24e1173]: 4. Look for edge cases that may have been missed
                  - generic [ref=f24e1175]: "Be thorough and skeptical. Report:"
                  - generic [ref=f24e1176]: "- What was verified and passed"
                  - generic [ref=f24e1177]: "- What was claimed but incomplete or broken"
                  - generic [ref=f24e1178]: "- Specific issues that need to be addressed"
                  - generic [ref=f24e1180]: Do not accept claims at face value. Test everything.
              - generic [ref=f24e1183]:
                - paragraph [ref=f24e1184]: Create a subagent file at .cursor/agents/verifier.md with YAML frontmatter containing name and description. The description should be 'Validates completed work. Use after tasks are marked done to confirm implementations are functional.' The prompt body should instruct it to be skeptical, verify implementations actually work by running tests, and look for edge cases.
                - link "Cursor Logo Try in Cursor" [ref=f24e1185] [cursor=pointer]:
                  - /url: cursor://anysphere.cursor-deeplink/prompt?text=Create%20a%20subagent%20file%20at%20.cursor%2Fagents%2Fverifier.md%20with%20YAML%20frontmatter%20containing%20name%20and%20description.%20The%20description%20should%20be%20'Validates%20completed%20work.%20Use%20after%20tasks%20are%20marked%20done%20to%20confirm%20implementations%20are%20functional.'%20The%20prompt%20body%20should%20instruct%20it%20to%20be%20skeptical%2C%20verify%20implementations%20actually%20work%20by%20running%20tests%2C%20and%20look%20for%20edge%20cases.
                  - img "Cursor Logo"
                  - generic [ref=f24e1186]: Try in Cursor
              - paragraph [ref=f24e1187]: "This pattern is useful for:"
              - list [ref=f24e1188]:
                - listitem [ref=f24e1189]: Validating that features work end-to-end before marking tickets complete
                - listitem [ref=f24e1190]: Catching partially implemented functionality
                - listitem [ref=f24e1191]: Ensuring tests actually pass (not just that test files exist)
              - heading [level=3] [ref=f24e1192]:
                - link "Copy link to orchestrator-pattern" [ref=f24e1193] [cursor=pointer]:
                  - /url: "#orchestrator-pattern"
                  - generic [ref=f24e1194]: Orchestrator pattern
              - paragraph [ref=f24e1202]: "For complex workflows, a parent agent can coordinate multiple specialist subagents in sequence:"
              - list [ref=f24e1203]:
                - listitem [ref=f24e1204]:
                  - strong [ref=f24e1205]: Planner
                  - text: analyzes requirements and creates a technical plan
                - listitem [ref=f24e1206]:
                  - strong [ref=f24e1207]: Implementer
                  - text: builds the feature based on the plan
                - listitem [ref=f24e1208]:
                  - strong [ref=f24e1209]: Verifier
                  - text: confirms the implementation matches requirements
              - paragraph [ref=f24e1210]: Each handoff includes structured output so the next agent has clear context.
              - heading [level=2] [ref=f24e1211]:
                - link "Copy link to example-subagents" [ref=f24e1212] [cursor=pointer]:
                  - /url: "#example-subagents"
                  - generic [ref=f24e1213]: Example subagents
              - heading [level=3] [ref=f24e1221]:
                - link "Copy link to debugger" [ref=f24e1222] [cursor=pointer]:
                  - /url: "#debugger"
                  - generic [ref=f24e1223]: Debugger
              - generic [ref=f24e1233]:
                - button [ref=f24e1234] [cursor=pointer]
                - code [ref=f24e1240]:
                  - generic [ref=f24e1241]: "---"
                  - generic [ref=f24e1242]: "name: debugger"
