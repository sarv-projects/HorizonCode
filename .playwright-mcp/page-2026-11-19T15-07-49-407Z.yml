              - paragraph [ref=f24e1393]:
                - text: You can also create subagents manually by adding markdown files to
                - code [ref=f24e1394]: .cursor/agents/
                - text: (project) or
                - code [ref=f24e1395]: ~/.cursor/agents/
                - text: (user).
              - heading [level=3] [ref=f24e1396]:
                - link "Copy link to viewing-subagents" [ref=f24e1397] [cursor=pointer]:
                  - /url: "#viewing-subagents"
                  - generic [ref=f24e1398]: Viewing subagents
              - paragraph [ref=f24e1406]:
                - text: Agent includes all custom subagents in its available tools. You can see which subagents are configured by checking the
                - code [ref=f24e1407]: .cursor/agents/
                - text: directory in your project.
              - heading [level=2] [ref=f24e1408]:
                - link "Copy link to performance-and-cost" [ref=f24e1409] [cursor=pointer]:
                  - /url: "#performance-and-cost"
                  - generic [ref=f24e1410]: Performance and cost
              - paragraph [ref=f24e1418]: Subagents have trade-offs. Understanding them helps you decide when to use them.
              - table [ref=f24e1421]:
                - rowgroup [ref=f24e1422]:
                  - row [ref=f24e1423]:
                    - columnheader "Benefit" [ref=f24e1424]
                    - columnheader "Trade-off" [ref=f24e1425]
                - rowgroup [ref=f24e1426]:
                  - row [ref=f24e1427]:
                    - cell "Context isolation" [ref=f24e1428]
                    - cell "Startup overhead (each subagent gathers its own context)" [ref=f24e1429]
                  - row [ref=f24e1430]:
                    - cell "Parallel execution" [ref=f24e1431]
                    - cell "Higher token usage (multiple contexts running simultaneously)" [ref=f24e1432]
                  - row [ref=f24e1433]:
                    - cell "Specialized focus" [ref=f24e1434]
                    - cell "Latency (may be slower than main agent for simple tasks)" [ref=f24e1435]
              - heading [level=3] [ref=f24e1436]:
                - link "Copy link to token-and-cost-considerations" [ref=f24e1437] [cursor=pointer]:
                  - /url: "#token-and-cost-considerations"
                  - generic [ref=f24e1438]: Token and cost considerations
              - list [ref=f24e1446]:
                - listitem [ref=f24e1447]:
                  - strong [ref=f24e1448]: Subagents consume tokens independently
                  - text: — Each subagent has its own context window and token usage. Running five subagents in parallel uses roughly five times the tokens of a single agent.
                - listitem [ref=f24e1449]:
                  - strong [ref=f24e1450]: Evaluate the overhead
                  - text: — For quick, simple tasks, the main agent is often faster. Subagents shine for complex, long-running, or parallel work.
                - listitem [ref=f24e1451]:
                  - strong [ref=f24e1452]: Subagents can be slower
                  - text: — The benefit is context isolation, not speed. A subagent doing a simple task may be slower than the main agent because it starts fresh.
              - heading [level=2] [ref=f24e1453]:
