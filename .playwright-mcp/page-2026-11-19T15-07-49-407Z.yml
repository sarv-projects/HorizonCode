                - link "Cursor Logo Try in Cursor" [ref=f24e1391] [cursor=pointer]:
                  - /url: cursor://anysphere.cursor-deeplink/prompt?text=Create%20a%20subagent%20file%20at%20.cursor%2Fagents%2Fsecurity-reviewer.md%20with%20YAML%20frontmatter%20containing%20name%20and%20description.%20The%20security-reviewer%20subagent%20should%20check%20code%20for%20common%20vulnerabilities%20like%20injection%2C%20XSS%2C%20and%20hardcoded%20secrets.
