      - main [ref=f19e384]:
        - generic [ref=f19e387]:
          - generic [ref=f19e388]:
            - generic [ref=f19e389]: Customize
            - generic [ref=f19e391]:
              - heading "Agent Skills" [level=1] [ref=f19e392]
              - paragraph [ref=f19e393]: Agent Skills is an open standard for extending AI agents with specialized capabilities. Skills package domain-specific knowledge and workflows that agents can use to perform specific tasks.
              - heading [level=2] [ref=f19e394]:
                - link "Copy link to what-are-skills" [ref=f19e395] [cursor=pointer]:
                  - /url: "#what-are-skills"
                  - generic [ref=f19e396]: What are skills?
              - paragraph [ref=f19e404]: A skill is a portable, version-controlled package that teaches agents how to perform domain-specific tasks. Skills can include scripts, templates, and references that agents may act on using their tools.
              - generic [ref=f19e405]:
                - generic [ref=f19e406]:
                  - paragraph [ref=f19e413]: Portable
                  - paragraph [ref=f19e415]: Skills work across any agent that supports the Agent Skills standard.
                - generic [ref=f19e416]:
                  - paragraph [ref=f19e422]: Version-controlled
                  - paragraph [ref=f19e424]: Skills are stored as files and can be tracked in your repository.
                - generic [ref=f19e425]:
                  - paragraph [ref=f19e429]: Actionable
                  - paragraph [ref=f19e431]: Skills can include scripts, templates, and references that agents act on using their tools.
                - generic [ref=f19e432]:
                  - paragraph [ref=f19e438]: Progressive
                  - paragraph [ref=f19e440]: Skills load resources on demand, keeping context usage efficient.
              - heading [level=2] [ref=f19e441]:
                - link "Copy link to how-skills-work" [ref=f19e442] [cursor=pointer]:
                  - /url: "#how-skills-work"
                  - generic [ref=f19e443]: How skills work
              - paragraph [ref=f19e451]: When Cursor starts, it automatically discovers skills from skill directories and makes them available to Agent. The agent is presented with available skills and decides when they are relevant based on context.
              - paragraph [ref=f19e452]:
                - text: Skills can also be manually invoked by typing
                - code [ref=f19e453]: /
                - text: in Agent chat and searching for the skill name. A skill invoked this way attaches to one message. To keep a skill on for the whole session, use it as a Custom Mode with
                - generic [ref=f19e454]: Alt+Enter
                - text: (Mac) or
                - generic [ref=f19e456]: Alt+Enter
                - text: (Windows). See
                - link "Custom Modes" [ref=f19e458] [cursor=pointer]:
                  - /url: /docs/agent/prompting#custom-modes
                - text: .
              - heading [level=2] [ref=f19e459]:
                - link "Copy link to built-in-cursor-skills" [ref=f19e460] [cursor=pointer]:
                  - /url: "#built-in-cursor-skills"
                  - generic [ref=f19e461]: Built-in Cursor skills
              - paragraph [ref=f19e469]: Cursor includes a small set of built in skills to improve your general workflows. These skills are managed by Cursor and appear alongside the skills you add yourself.
              - table [ref=f19e471]:
                - rowgroup [ref=f19e472]:
                  - row [ref=f19e473]:
                    - columnheader "Skill" [ref=f19e474]
                    - columnheader "What it does" [ref=f19e475]
                - rowgroup [ref=f19e476]:
                  - row [ref=f19e477]:
                    - cell [ref=f19e478]:
                      - code [ref=f19e479]: /automate
                    - cell "Creates Cursor Automations triggered by schedules, Slack messages, GitHub events, and other sources." [ref=f19e480]
                  - row [ref=f19e481]:
                    - cell [ref=f19e482]:
                      - code [ref=f19e483]: /autopilot
                    - cell "Monitors a pull request and addresses feedback, conflicts, failing checks, and follow-up work." [ref=f19e484]
                  - row [ref=f19e485]:
                    - cell [ref=f19e486]:
                      - code [ref=f19e487]: /canvas
                    - cell "Creates interactive React artifacts that render alongside the conversation." [ref=f19e488]
                  - row [ref=f19e489]:
                    - cell [ref=f19e490]:
                      - code [ref=f19e491]: /create-hook
                    - cell [ref=f19e492]:
                      - text: Creates Cursor hooks and updates
                      - code [ref=f19e493]: hooks.json
                      - text: for agent lifecycle events.
                  - row [ref=f19e494]:
                    - cell [ref=f19e495]:
                      - code [ref=f19e496]: /create-rule
                    - cell "Creates Cursor rules with the appropriate scope and instructions." [ref=f19e497]
                  - row [ref=f19e498]:
                    - cell [ref=f19e499]:
                      - code [ref=f19e500]: /create-skill
                    - cell [ref=f19e501]:
                      - text: Creates Agent Skills, including their structure and
                      - code [ref=f19e502]: SKILL.md
                      - text: files.
                  - row [ref=f19e503]:
                    - cell [ref=f19e504]:
                      - code [ref=f19e505]: /create-subagent
                    - cell "Creates custom subagents with focused roles and delegation instructions." [ref=f19e506]
                  - row [ref=f19e507]:
                    - cell [ref=f19e508]:
                      - code [ref=f19e509]: /cursor-blame
                    - cell "Investigates AI-authored changes and the prompts that produced them." [ref=f19e510]
                  - row [ref=f19e511]:
                    - cell [ref=f19e512]:
