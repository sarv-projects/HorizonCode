                  - row [ref=f19e519]:
                    - cell [ref=f19e520]:
                      - code [ref=f19e521]: /review
                    - cell "Selects and runs the appropriate code-review agent." [ref=f19e522]
                  - row [ref=f19e523]:
                    - cell [ref=f19e524]:
