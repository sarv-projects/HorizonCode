                  - generic [ref=f19e1028]: Use personal skills with Cloud Agents
              - paragraph [ref=f19e1036]:
                - text: Personal skills in
                - code [ref=f19e1037]: ~/.cursor/skills/
                - text: run on your local machine. Turn on
                - strong [ref=f19e1038]: Sync Skills for Cloud Agents
                - text: to use those same skills with
                - link "Cloud Agents" [ref=f19e1039] [cursor=pointer]:
                  - /url: /docs/cloud-agent
                - text: .
              - paragraph [ref=f19e1040]: Synced skills stay private to you. They are not shared with your team.
              - paragraph [ref=f19e1041]:
                - text: Synced skills load in Cloud Agents you start yourself.
                - link "Automation" [ref=f19e1042] [cursor=pointer]:
                  - /url: /docs/cloud-agent/automations
                - text: runs don't load them, including automations set to
                - link [ref=f19e1043] [cursor=pointer]:
                  - /url: /docs/cloud-agent/automations#run-as
                  - text: Run as
                  - strong [ref=f19e1044]: Me
                - text: . To give an automation a skill, add it to the repository's
                - code [ref=f19e1045]: .cursor/skills/
                - text: folder.
              - heading [level=3] [ref=f19e1046]:
                - link "Copy link to sync-your-skills" [ref=f19e1047] [cursor=pointer]:
                  - /url: "#sync-your-skills"
                  - generic [ref=f19e1048]: Sync your skills
              - list [ref=f19e1056]:
                - listitem [ref=f19e1057]:
                  - text: Open
                  - strong [ref=f19e1058]: Settings → Agents
                  - text: .
                - listitem [ref=f19e1059]:
                  - text: Under
                  - strong [ref=f19e1060]: Context and Tools
                  - text: ", turn on"
                  - strong [ref=f19e1061]: Sync Skills for Cloud Agents
                  - text: .
                - listitem [ref=f19e1062]:
                  - text: Confirm. Cursor moves the contents of
                  - code [ref=f19e1063]: ~/.cursor/skills/
                  - text: into synced storage so your Cloud Agents can use them.
              - paragraph [ref=f19e1064]: After that, Cursor uploads skill changes shortly after you save while Cursor is running. Cloud Agents use the latest synced copy.
              - paragraph [ref=f19e1065]:
                - text: You can also start a sync from
                - strong [ref=f19e1066]: Customize → Skills
                - text: .
              - paragraph [ref=f19e1067]:
                - text: Only
                - code [ref=f19e1068]: ~/.cursor/skills/
                - text: syncs. Project skills,
                - code [ref=f19e1069]: ~/.agents/skills/
                - text: ", and other files on your machine stay local."
              - heading [level=3] [ref=f19e1070]:
                - link "Copy link to stop-syncing" [ref=f19e1071] [cursor=pointer]:
                  - /url: "#stop-syncing"
                  - generic [ref=f19e1072]: Stop syncing
              - paragraph [ref=f19e1080]:
                - text: Turn off
                - strong [ref=f19e1081]: Sync Skills for Cloud Agents
                - text: under
                - strong [ref=f19e1082]: Settings → Agents
                - text: . Cursor moves the synced skills back to your machine.
              - heading [level=3] [ref=f19e1083]:
                - link "Copy link to team-admin-controls" [ref=f19e1084] [cursor=pointer]:
                  - /url: "#team-admin-controls"
                  - generic [ref=f19e1085]: Team admin controls
              - paragraph [ref=f19e1093]: "On Teams and Enterprise plans, admins decide whether members can sync:"
              - list [ref=f19e1094]:
                - listitem [ref=f19e1095]:
                  - text: Open
                  - link "Team Settings" [ref=f19e1096] [cursor=pointer]:
                    - /url: https://cursor.com/dashboard/team-settings
                  - text: .
                - listitem [ref=f19e1097]:
                  - text: Go to
                  - strong [ref=f19e1098]: Security & Identity
                  - text: .
                - listitem [ref=f19e1099]:
                  - text: Turn
                  - strong [ref=f19e1100]: Sync Skills for Cloud Agents
                  - text: off to disable sync for everyone on the team.
              - paragraph [ref=f19e1101]: When the team setting is on, each member still chooses whether to sync. When it is off, no one on the team can sync.
              - paragraph [ref=f19e1102]:
                - text: To share a skill with teammates,
                - link "publish it to your team marketplace" [ref=f19e1103] [cursor=pointer]:
                  - /url: /docs/plugins#publish-a-skill-to-your-team
                - text: ". Publishing is different from sync: teammates can install a published skill, and Cursor stores a copy in a repository hosted for your team."
              - heading [level=2] [ref=f19e1104]:
                - link "Copy link to installing-skills-from-a-repository" [ref=f19e1105] [cursor=pointer]:
                  - /url: "#installing-skills-from-a-repository"
                  - generic [ref=f19e1106]: Installing skills from a repository
              - paragraph [ref=f19e1114]:
                - text: Skills aren't imported on their own. To bring skills in from a GitHub repository, package them in a
                - link "plugin" [ref=f19e1115] [cursor=pointer]:
                  - /url: /docs/plugins
                - text: "and publish that plugin through a marketplace: import the repository in"
                - strong [ref=f19e1116]: Customize
                - text: with
                - strong [ref=f19e1117]: From GitHub Repository
                - text: (the repository needs a
                - code [ref=f19e1118]: .cursor-plugin/marketplace.json
                - text: ), or add it as a
                - link "team marketplace" [ref=f19e1119] [cursor=pointer]:
                  - /url: /docs/plugins#add-a-team-marketplace
                - text: ", then"
                - link "install the plugin" [ref=f19e1120] [cursor=pointer]:
                  - /url: /docs/plugins#installing-plugins
                - text: . The skills arrive with the plugin and appear in Customize alongside your other skills.
              - heading [level=2] [ref=f19e1121]:
                - link "Copy link to migrating-rules-and-commands-to-skills" [ref=f19e1122] [cursor=pointer]:
                  - /url: "#migrating-rules-and-commands-to-skills"
                  - generic [ref=f19e1123]: Migrating rules and commands to skills
              - paragraph [ref=f19e1131]:
                - text: Cursor includes a built-in
                - code [ref=f19e1132]: /migrate-to-skills
                - text: skill in 2.4 that helps you convert existing dynamic rules and slash commands to skills.
              - paragraph [ref=f19e1133]: "The migration skill converts:"
              - list [ref=f19e1134]:
                - listitem [ref=f19e1135]:
                  - strong [ref=f19e1136]: Dynamic rules
                  - text: ": Rules that use the \"Apply Intelligently\" configuration—rules with"
                  - code [ref=f19e1137]: "alwaysApply: false"
                  - text: (or undefined) and no
                  - code [ref=f19e1138]: globs
                  - text: patterns defined. These are converted to standard skills.
                - listitem [ref=f19e1139]:
                  - strong [ref=f19e1140]: Slash commands
                  - text: ": Both user-level and workspace-level commands are converted to skills with"
                  - code [ref=f19e1141]: "disable-model-invocation: true"
                  - text: ", preserving their explicit invocation behavior."
              - paragraph [ref=f19e1142]: "To migrate:"
              - list [ref=f19e1143]:
                - listitem [ref=f19e1144]:
                  - text: Type
                  - code [ref=f19e1145]: /migrate-to-skills
                  - text: in Agent chat
                - listitem [ref=f19e1146]: The agent will identify eligible rules and commands and convert them to skills
                - listitem [ref=f19e1147]:
                  - text: Review the generated skills in
                  - code [ref=f19e1148]: .cursor/skills/
              - alert [ref=f19e1149]:
                - paragraph [ref=f19e1153]:
                  - text: Rules with
                  - code [ref=f19e1154]: "alwaysApply: true"
                  - text: or specific
                  - code [ref=f19e1155]: globs
                  - text: patterns are not migrated, as they have explicit triggering conditions that differ from skill behavior. User rules are also not migrated since they are not stored on the file system.
              - heading [level=2] [ref=f19e1156]:
                - link "Copy link to learn-more" [ref=f19e1157] [cursor=pointer]:
