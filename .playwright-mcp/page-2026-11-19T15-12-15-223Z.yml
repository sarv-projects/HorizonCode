                - generic [ref=f177e443]: "\"subtype\": \"success\","
                - generic [ref=f177e444]: "\"is_error\": false,"
                - generic [ref=f177e445]: "\"duration_ms\": 1234,"
                - generic [ref=f177e446]: "\"duration_api_ms\": 1234,"
                - generic [ref=f177e447]: "\"result\": \"<full assistant text>\","
                - generic [ref=f177e448]: "\"session_id\": \"<uuid>\","
                - generic [ref=f177e449]: "\"request_id\": \"<optional request id>\""
                - generic [ref=f177e450]: "}"
