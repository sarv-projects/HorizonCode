            - paragraph [ref=f177e393]:
              - text: The Cursor Agent CLI provides multiple output formats with the
              - code [ref=f177e394]: "--output-format"
              - text: option when combined with
              - code [ref=f177e395]: "--print"
              - text: . These formats include structured formats for programmatic use (
              - code [ref=f177e396]: json
              - text: ","
              - code [ref=f177e397]: stream-json
              - text: ) and a simplified text format for human-readable output (
              - code [ref=f177e398]: text
              - text: ).
            - alert [ref=f177e399]:
              - paragraph [ref=f177e403]:
                - text: The default
                - code [ref=f177e404]: "--output-format"
                - text: is
                - code [ref=f177e405]: text
                - text: . This option is only valid when printing (
                - code [ref=f177e406]: "--print"
                - text: ) or when print mode is inferred (non-TTY stdout or piped stdin).
            - heading [level=2] [ref=f177e407]:
              - link "Copy link to json-format" [ref=f177e408] [cursor=pointer]:
                - /url: "#json-format"
                - generic [ref=f177e409]: JSON format
            - paragraph [ref=f177e417]:
              - text: The
              - code [ref=f177e418]: json
              - text: output format emits a single JSON object (followed by a newline) when the run completes successfully. Deltas and tool events are not emitted; text is aggregated into the final result.
            - paragraph [ref=f177e419]: On failure, the process exits with a non-zero code and writes an error message to stderr. No well-formed JSON object is emitted in failure cases.
            - heading [level=3] [ref=f177e420]:
              - link "Copy link to success-response" [ref=f177e421] [cursor=pointer]:
                - /url: "#success-response"
                - generic [ref=f177e422]: Success response
            - paragraph [ref=f177e430]: "When successful, the CLI outputs a JSON object with the following structure:"
