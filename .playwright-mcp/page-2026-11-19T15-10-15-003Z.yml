    - main [ref=f112e384]:
      - generic [ref=f112e387]:
        - generic [ref=f112e388]:
          - generic [ref=f112e389]: Agent
          - generic [ref=f112e391]:
            - heading "Plan Mode" [level=1] [ref=f112e392]
            - paragraph [ref=f112e393]: Plan Mode creates detailed implementation plans before writing any code. Agent researches your codebase, asks clarifying questions, and generates a reviewable plan you can edit before building.
            - paragraph [ref=f112e394]:
              - text: Press
              - generic [ref=f112e395]: Shift+Tab
              - text: from the chat input to rotate to Plan Mode. Cursor also suggests it automatically when you type keywords that indicate complex tasks.
            - heading [level=2] [ref=f112e397]:
              - link "Copy link to how-it-works" [ref=f112e398] [cursor=pointer]:
                - /url: "#how-it-works"
                - generic [ref=f112e399]: How it works
            - list [ref=f112e407]:
              - listitem [ref=f112e408]: Agent asks clarifying questions to understand your requirements
              - listitem [ref=f112e409]: Researches your codebase to gather relevant context
              - listitem [ref=f112e410]: Creates a comprehensive implementation plan
              - listitem [ref=f112e411]: You review and edit the plan through chat or markdown files
              - listitem [ref=f112e412]: Click to build the plan when ready
            - paragraph [ref=f112e413]: Plans are saved by default in your home directory. Click "Save to workspace" to move it to your workspace for future reference, team sharing, and documentation.
            - heading [level=2] [ref=f112e414]:
              - link "Copy link to when-to-use-plan-mode" [ref=f112e415] [cursor=pointer]:
                - /url: "#when-to-use-plan-mode"
                - generic [ref=f112e416]: When to use Plan Mode
            - paragraph [ref=f112e424]: "Plan Mode works best for:"
            - list [ref=f112e425]:
              - listitem [ref=f112e426]: Complex features with multiple valid approaches
              - listitem [ref=f112e427]: Tasks that touch many files or systems
              - listitem [ref=f112e428]: Unclear requirements where you need to explore before understanding scope
              - listitem [ref=f112e429]: Architectural decisions where you want to review the approach first
            - paragraph [ref=f112e430]: For quick changes or tasks you've done many times before, jumping straight to Agent mode is fine.
            - heading [level=2] [ref=f112e431]:
              - link "Copy link to starting-over-from-a-plan" [ref=f112e432] [cursor=pointer]:
                - /url: "#starting-over-from-a-plan"
                - generic [ref=f112e433]: Starting over from a plan
            - paragraph [ref=f112e441]: Sometimes Agent builds something that doesn't match what you wanted. Instead of trying to fix it through follow-up prompts, go back to the plan.
            - paragraph [ref=f112e442]: Revert the changes, refine the plan to be more specific about what you need, and run it again. This is often faster than fixing an in-progress agent, and produces cleaner results.
            - alert [ref=f112e443]:
              - paragraph [ref=f112e447]:
                - text: For larger changes, spend extra time creating a precise, well-scoped plan. The hard part is often figuring out
                - strong [ref=f112e448]: what
                - text: change should be made. With the right instructions, delegate implementation to Agent.
            - heading [level=2] [ref=f112e449]:
              - link "Copy link to switching-modes" [ref=f112e450] [cursor=pointer]:
