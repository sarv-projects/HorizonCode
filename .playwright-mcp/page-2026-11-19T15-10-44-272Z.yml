              - generic [ref=f137e1152]:
                - paragraph
                - paragraph [ref=f137e1153]:
                  - text: Opting in to regional data residency incurs a 10% uplift on Model pricing for eligible Models. See
                  - link "Privacy and Data Governance" [ref=f137e1154] [cursor=pointer]:
                    - /url: /docs/enterprise/privacy-and-data-governance
                  - text: for details on supported regions, Models, functions and data residency policies.
                - paragraph
              - heading [level=2] [ref=f137e1155]:
                - link "Copy link to top-ups-and-spending-caps" [ref=f137e1156] [cursor=pointer]:
                  - /url: "#top-ups-and-spending-caps"
                  - generic [ref=f137e1157]: Top-ups and spending caps
              - paragraph [ref=f137e1165]: "Top-ups add prepaid credit to your subscription. Credit pays for two kinds of additional usage:"
              - list [ref=f137e1166]:
                - listitem [ref=f137e1167]:
                  - strong [ref=f137e1168]: Third-party models
                  - text: in Cursor, from the first request, at API list price.
                - listitem [ref=f137e1169]:
                  - strong [ref=f137e1170]: Cursor models beyond your weekly pool
                  - text: ", at the rates in the table above."
              - paragraph [ref=f137e1171]:
                - text: Buy credit when you choose, or turn on
                - strong [ref=f137e1172]: Auto Top-up
                - text: to refill when your balance drops below a threshold you set. A
                - strong [ref=f137e1173]: monthly additional usage limit
                - text: caps how much paid additional usage you can consume each month, regardless of how much credit you hold. Manage all three under
                - strong [ref=f137e1174]: Additional usage credits
                - text: at
                - link "grok.com/dashboard/billing" [ref=f137e1175] [cursor=pointer]:
                  - /url: https://grok.com/dashboard/billing
                - text: . On Teams, admins manage a shared prepaid balance and one cap for the whole team.
              - heading [level=3] [ref=f137e1176]:
                - link "Copy link to what-happens-when-i-reach-my-limit" [ref=f137e1177] [cursor=pointer]:
                  - /url: "#what-happens-when-i-reach-my-limit"
                  - generic [ref=f137e1178]: What happens when I reach my limit?
              - paragraph [ref=f137e1186]: "When your weekly pool runs out, you can:"
              - list [ref=f137e1187]:
                - listitem [ref=f137e1188]:
                  - strong [ref=f137e1189]: Wait for the reset.
                  - text: Your pool refreshes weekly.
                - listitem [ref=f137e1190]:
                  - strong [ref=f137e1191]: Use prepaid credit.
                  - text: Keep working at the same per-model rates with top-ups or Auto Top-up.
                - listitem [ref=f137e1192]:
                  - strong [ref=f137e1193]: Upgrade your plan.
                  - text: Move to a higher tier for a larger weekly pool.
              - paragraph [ref=f137e1194]:
                - text: Requests are never downgraded in quality or speed. See
                - link "Usage and limits" [ref=f137e1195] [cursor=pointer]:
                  - /url: /help/models-and-usage/usage-limits
                - text: for how to check usage and what the limit notification means.
              - heading [level=2] [ref=f137e1196]:
                - link "Copy link to teams" [ref=f137e1197] [cursor=pointer]:
                  - /url: "#teams"
                  - generic [ref=f137e1198]: Teams
              - paragraph [ref=f137e1206]: Teams are priced per seat. Each member gets a Premium, Super, or Ultra seat at the same price and with the same weekly usage as the matching individual plan, and you can mix seat tiers on one team. Plus isn't available for teams.
              - paragraph [ref=f137e1207]: Team plans add centralized billing and administration, a team marketplace for internal rules, skills, and plugins, usage analytics, team-wide privacy mode enforcement, custom Chat data retention, and SAML/OIDC SSO. Enterprise adds pooled usage across Grok and Cursor, invoicing, SCIM, granular spend controls, and advanced security controls.
              - paragraph [ref=f137e1208]:
                - text: We recommend Teams for any customer that is happy self-serving and
                - link "Enterprise" [ref=f137e1209] [cursor=pointer]:
                  - /url: https://cursor.com/contact-sales?source=docs-models-pricing
                - text: for customers that need priority support, pooled usage, invoicing, SCIM, or advanced security controls. Learn more about
                - link "Team pricing" [ref=f137e1210] [cursor=pointer]:
                  - /url: /docs/account/teams/pricing
                - text: .
              - heading [level=2] [ref=f137e1211]:
                - link "Copy link to cursor-token-rate" [ref=f137e1212] [cursor=pointer]:
                  - /url: "#cursor-token-rate"
                  - generic [ref=f137e1213]: Cursor Token Rate
              - paragraph [ref=f137e1221]: On Teams and Enterprise plans, eligible third-party model requests include a Cursor Token Rate of $0.25 per million tokens. This rate applies on top of model API pricing for additional usage and BYOK usage. Individual plans don't pay it.
              - paragraph [ref=f137e1222]: The rate applies when you select an eligible third-party model directly, and when Cursor Router (Balance or Intelligence) routes to one. It applies to input tokens, output tokens, and cached tokens.
              - paragraph [ref=f137e1223]: The Cursor Token Rate does not apply to Cursor models, including Grok and Composer, or to Cost mode requests.
              - paragraph [ref=f137e1224]: The Cursor Token Rate also does not apply to third-party models whose cache-read price is strictly below $0.10 per million tokens across every pricing tier. This exemption also applies when you use your own API key.
              - heading [level=2] [ref=f137e1225]:
                - link "Copy link to auto-modes" [ref=f137e1226] [cursor=pointer]:
                  - /url: "#auto-modes"
                  - generic [ref=f137e1227]: Auto modes
              - paragraph [ref=f137e1235]:
                - text: "Auto has three modes: Cost, Balance, and Intelligence. See"
                - link "Cursor Router" [ref=f137e1236] [cursor=pointer]:
                  - /url: /docs/cursor-router
                - text: for how these modes work.
              - paragraph [ref=f137e1237]:
                - text: "Cost mode (classic Auto) bills as a Cursor-model request and draws from your weekly pool whatever model serves it. On Teams and Enterprise with Cursor Router on, Balance and Intelligence bill at the routed model's list price: a route to a Cursor model draws from the weekly pool, and a route to a third-party model is third-party usage paid from prepaid credit. Individual plans have Cost mode only. See"
                - link "Model pricing" [ref=f137e1238] [cursor=pointer]:
                  - /url: "#model-pricing"
                - text: for per-model rates. On Teams and Enterprise, a Balance or Intelligence route to a third-party model also incurs the
                - link "Cursor Token Rate" [ref=f137e1239] [cursor=pointer]:
                  - /url: "#cursor-token-rate"
                - text: unless its cache-read price is strictly below $0.10 per million tokens across every pricing tier. Cost mode does not.
              - heading [level=2] [ref=f137e1240]:
                - link "Copy link to legacy-cursor-plans" [ref=f137e1241] [cursor=pointer]:
                  - /url: "#legacy-cursor-plans"
                  - generic [ref=f137e1242]: Legacy Cursor plans
              - paragraph [ref=f137e1250]:
                - text: Hobby, Start, Pro, Pro+, Ultra, and Teams Standard and Premium seats continue for existing customers. They include two monthly usage pools, Cursor Models and Other Models, and use on-demand usage instead of top-ups. See
                - link "Legacy Cursor plans" [ref=f137e1251] [cursor=pointer]:
                  - /url: /docs/account/pricing/legacy-cursor-plans
                - text: for how they work and how they map to The X Subscription.
              - heading [level=2] [ref=f137e1252]:
                - link "Copy link to legacy-request-based-pricing" [ref=f137e1253] [cursor=pointer]:
                  - /url: "#legacy-request-based-pricing"
                  - generic [ref=f137e1254]: Legacy request-based pricing
              - heading [level=3] [ref=f137e1262]:
                - link "Copy link to max-mode" [ref=f137e1263] [cursor=pointer]:
