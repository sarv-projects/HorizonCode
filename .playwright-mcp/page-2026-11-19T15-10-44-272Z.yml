                    - cell "50x Plus" [ref=f137e536]
                    - cell "API list price, from prepaid credit" [ref=f137e537]
                  - row [ref=f137e538]:
                    - cell [ref=f137e539]:
                      - strong [ref=f137e540]: Teams
                    - cell "$30, $100, or $200 per seat/mo" [ref=f137e541]
                    - cell "Matches the seat's tier" [ref=f137e542]
                    - cell [ref=f137e543]:
                      - text: API list price plus the
                      - link "Cursor Token Rate" [ref=f137e544] [cursor=pointer]:
                        - /url: "#cursor-token-rate"
                      - text: on eligible models
                  - row [ref=f137e545]:
                    - cell [ref=f137e546]:
                      - strong [ref=f137e547]: Enterprise
                    - cell "Custom" [ref=f137e548]
                    - cell "Pooled" [ref=f137e549]
                    - cell "API list price plus the Cursor Token Rate on eligible models" [ref=f137e550]
              - paragraph [ref=f137e551]: Annual billing is available at $80/yr for Plus, $300/yr for Premium, $1,000/yr for Super, and $2,000/yr for Ultra. Prices exclude tax.
              - list [ref=f137e552]:
                - listitem [ref=f137e553]:
                  - strong [ref=f137e554]: Free.
                  - text: Agent and Chat with limited usage.
                - listitem [ref=f137e555]:
                  - strong [ref=f137e556]: Plus.
                  - text: "Agent with Cursor's own models (Grok 4.7, Grok 4.6, Grok 4.5, and Composer 2.5) at fixed settings: Fast is off, effort is medium, and Grok 4.7 uses the 256k context window. Also Grok Chat, Voice, Imagine, Build, and Grok API access. No Auto, Cloud Agents, Automations, Bugbot, Origin, third-party models, or your own API keys."
                - listitem [ref=f137e557]:
                  - strong [ref=f137e558]: Premium.
                  - text: Everything in Plus, with 4x the usage. Adds Cloud Agents and Automations, code hosting on
                  - link "Origin" [ref=f137e559] [cursor=pointer]:
                    - /url: /docs/origin
                  - text: ", code review with"
                  - link "Bugbot" [ref=f137e560] [cursor=pointer]:
                    - /url: /docs/bugbot
                  - text: ", third-party models at API list price, and Grok Bot."
                - listitem [ref=f137e561]:
                  - strong [ref=f137e562]: Super.
                  - text: Everything in Premium, with 15x Plus usage and priority model access at peak times.
                - listitem [ref=f137e563]:
                  - strong [ref=f137e564]: Ultra.
                  - text: Everything in Super, with 50x Plus usage and earliest access to new products and models.
              - paragraph [ref=f137e565]:
                - text: Premium suits new Agent users, Super suits daily Agent users, and Ultra suits power users running several agents or Automations. See
                - link "cursor.com/pricing" [ref=f137e566] [cursor=pointer]:
                  - /url: https://cursor.com/pricing
                - text: for the full feature comparison, including Grok and X benefits.
              - heading [level=2] [ref=f137e567]:
                - link "Copy link to included-usage" [ref=f137e568] [cursor=pointer]:
                  - /url: "#included-usage"
                  - generic [ref=f137e569]: Included usage
              - paragraph [ref=f137e577]: "Each paid plan includes one pool of usage for Cursor models. The pool is shared across everything on your subscription: Agent in the editor, CLI, Cloud Agents, Grok Bot, and the Grok apps. It refreshes weekly, so one heavy day doesn't use up your month."
              - paragraph [ref=f137e578]:
                - text: Different models draw from the pool at different rates. Your remaining usage and next reset date are shown in your editor settings and under
                - strong [ref=f137e579]: Usage
                - text: at
                - link "grok.com/dashboard" [ref=f137e580] [cursor=pointer]:
                  - /url: https://grok.com/dashboard
                - text: .
