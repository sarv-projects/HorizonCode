      - main [ref=f137e471]:
        - generic [ref=f137e474]:
          - generic [ref=f137e475]:
            - generic [ref=f137e476]: Get Started
            - generic [ref=f137e478]:
              - heading "Models & Pricing" [level=1] [ref=f137e479]
              - paragraph [ref=f137e480]:
                - text: Cursor supports frontier models from OpenAI, Anthropic, Google, SpaceXSI, and more. Cursor is sold as part of
                - link "The X Subscription" [ref=f137e481] [cursor=pointer]:
                  - /url: /help/the-x-subscription/overview
                - text: ", one subscription for Grok, Cursor, and X. Paid plans include a weekly pool of usage for Cursor models, shared across Grok and Cursor. Third-party models aren't included; on Premium and above you can use them at API list price, paid from prepaid credit."
              - alert [ref=f137e482]:
                - paragraph [ref=f137e486]:
                  - text: On Pro, Pro+, Ultra, Start, or a Teams Standard or Premium seat? Those are
                  - link "legacy Cursor plans" [ref=f137e487] [cursor=pointer]:
                    - /url: /docs/account/pricing/legacy-cursor-plans
                  - text: . They keep working as they are, with two monthly usage pools and on-demand usage.
              - heading [level=2] [ref=f137e488]:
                - link "Copy link to plans" [ref=f137e489] [cursor=pointer]:
                  - /url: "#plans"
                  - generic [ref=f137e490]: Plans
