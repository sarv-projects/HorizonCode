                  - generic [ref=f137e583]: Cursor models
              - paragraph [ref=f137e591]:
                - text: The pool covers Grok 4.7, Grok 4.6, Grok 4.5, and Composer 2.5. On Teams and Enterprise plans,
                - link "Cursor Router" [ref=f137e592] [cursor=pointer]:
