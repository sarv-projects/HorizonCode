      - main [ref=f84e407]:
        - generic [ref=f84e410]:
          - generic [ref=f84e411]:
            - generic [ref=f84e412]: Agent
            - generic [ref=f84e414]:
              - heading "Search" [level=1] [ref=f84e415]
              - heading [level=2] [ref=f84e416]:
                - link "Copy link to instant-grep" [ref=f84e417] [cursor=pointer]:
                  - /url: "#instant-grep"
                  - generic [ref=f84e418]: Instant Grep
              - paragraph [ref=f84e426]: "The fastest way to find code is an exact match: a function name, variable, error string, or regex pattern. Agent uses grep automatically when you reference specific symbols."
              - paragraph [ref=f84e427]:
                - text: Cursor ships with
                - link "Instant Grep" [ref=f84e428] [cursor=pointer]:
                  - /url: /changelog/2-1#instant-grep-beta
                - text: ", a custom search engine that outperforms"
                - code [ref=f84e429]: ripgrep
                - text: on large codebases. It runs automatically; no configuration needed.
              - paragraph [ref=f84e430]:
                - text: Instant Grep supports full regex and word-boundary matching, so Agent can construct patterns like
                - code [ref=f84e431]: import.*PaymentService
                - text: or
                - code [ref=f84e432]: PaymentFailedError
                - text: to trace references across files.
              - heading [level=2] [ref=f84e433]:
                - link "Copy link to privacy-and-security" [ref=f84e434] [cursor=pointer]:
                  - /url: "#privacy-and-security"
                  - generic [ref=f84e435]: Privacy and security
              - paragraph [ref=f84e443]: Instant Grep builds and queries its index on your machine. Cursor does not upload file paths or code to build a search index, and it does not store embeddings of your codebase for search.
              - paragraph [ref=f84e444]:
                - text: When Agent opens a match, that file content can still be included in the model request.
                - link "Data Use" [ref=f84e445] [cursor=pointer]:
                  - /url: /data-use
                - text: describes how Cursor handles that data.
              - heading [level=2] [ref=f84e446]:
                - link "Copy link to explore-subagent" [ref=f84e447] [cursor=pointer]:
                  - /url: "#explore-subagent"
                  - generic [ref=f84e448]: Explore subagent
              - paragraph [ref=f84e456]:
                - text: Agent can spawn an
                - link "Explore subagent" [ref=f84e457] [cursor=pointer]:
                  - /url: /docs/subagents
                - text: that runs in its own context window with a faster model. It executes many parallel searches without bloating the main conversation, returning only the relevant findings.
              - paragraph [ref=f84e458]: "Agent uses the Explore subagent automatically when it decides a task benefits from broad search. You can also request it directly: \"use a subagent to find all the places we validate user input.\""
              - paragraph [ref=f84e459]: This is useful for context management. Searching through many files generates a lot of context. The subagent keeps the main conversation focused by summarizing results instead of dumping raw file contents.
              - heading [level=2] [ref=f84e460]:
                - link "Copy link to faq" [ref=f84e461] [cursor=pointer]:
                  - /url: "#faq"
                  - generic [ref=f84e462]: FAQ
              - heading [level=3] [ref=f84e472]:
                - button "Does Cursor support multi-root workspaces?" [ref=f84e473] [cursor=pointer]
