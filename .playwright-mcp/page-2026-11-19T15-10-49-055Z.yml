      - main [ref=f142e385]:
        - generic [ref=f142e388]:
          - generic [ref=f142e389]:
            - generic [ref=f142e390]: CLI
            - generic [ref=f142e392]:
              - heading "Shell Mode" [level=1] [ref=f142e393]
              - paragraph [ref=f142e394]: Shell Mode runs shell commands directly from the CLI without leaving your conversation. Use it for quick, non-interactive commands with safety checks and output displayed in the conversation.
              - heading [level=2] [ref=f142e397]:
                - link "Copy link to command-execution" [ref=f142e398] [cursor=pointer]:
                  - /url: "#command-execution"
                  - generic [ref=f142e399]: Command execution
              - paragraph [ref=f142e407]:
                - text: Commands run in your login shell (
                - code [ref=f142e408]: $SHELL
                - text: ") with the CLI's working directory and environment. Chain commands to run in other directories:"
              - generic [ref=f142e411]:
                - button [ref=f142e412] [cursor=pointer]
                - code [ref=f142e418]:
                  - generic [ref=f142e419]: cd subdir && npm test
              - heading [level=2] [ref=f142e420]:
                - link "Copy link to output" [ref=f142e421] [cursor=pointer]:
                  - /url: "#output"
                  - generic [ref=f142e422]: Output
              - paragraph [ref=f142e430]: Large outputs are truncated automatically and long-running processes timeout to maintain performance.
              - heading [level=2] [ref=f142e431]:
                - link "Copy link to limitations" [ref=f142e432] [cursor=pointer]:
                  - /url: "#limitations"
                  - generic [ref=f142e433]: Limitations
              - list [ref=f142e441]:
                - listitem [ref=f142e442]: Commands timeout after 30 seconds
                - listitem [ref=f142e443]: Long-running processes, servers, and interactive prompts are not supported
                - listitem [ref=f142e444]: Use short, non-interactive commands for best results
              - heading [level=2] [ref=f142e445]:
                - link "Copy link to permissions" [ref=f142e446] [cursor=pointer]:
                  - /url: "#permissions"
                  - generic [ref=f142e447]: Permissions
              - paragraph [ref=f142e455]:
                - text: Commands are checked against your permissions and team settings before execution. See
                - link "Permissions" [ref=f142e456] [cursor=pointer]:
                  - /url: /docs/cli/reference/permissions
                - text: for detailed configuration.
              - paragraph [ref=f142e457]: Admin policies may block certain commands, and commands with redirection cannot be allowlisted inline.
              - heading [level=2] [ref=f142e458]:
                - link "Copy link to usage-guidelines" [ref=f142e459] [cursor=pointer]:
                  - /url: "#usage-guidelines"
                  - generic [ref=f142e460]: Usage guidelines
              - paragraph [ref=f142e468]: Shell Mode works well for status checks, quick builds, file operations, and environment inspection.
              - paragraph [ref=f142e469]: Avoid long-running servers, interactive applications, and commands requiring input.
              - paragraph [ref=f142e470]:
                - text: Each command runs independently - use
                - code [ref=f142e471]: cd <dir> && ...
                - text: to run commands in other directories.
              - heading [level=2] [ref=f142e472]:
                - link "Copy link to troubleshooting" [ref=f142e473] [cursor=pointer]:
                  - /url: "#troubleshooting"
                  - generic [ref=f142e474]: Troubleshooting
              - list [ref=f142e482]:
                - listitem [ref=f142e483]:
                  - text: If a command hangs, cancel with
                  - generic [ref=f142e484]: Ctrl+C
                  - text: and add non-interactive flags
                - listitem [ref=f142e486]:
                  - text: When prompted for permissions, approve once or add to allowlist with
                  - generic [ref=f142e487]: Tab
                - listitem [ref=f142e489]:
                  - text: For truncated output, use
                  - generic [ref=f142e490]: Ctrl+O
                  - text: to expand
                - listitem [ref=f142e492]:
                  - text: To run in different directories, use
                  - code [ref=f142e493]: cd <dir> && ...
                  - text: since changes don't persist
                - listitem [ref=f142e494]:
                  - text: Shell Mode supports zsh and bash from your
                  - code [ref=f142e495]: $SHELL
                  - text: variable
              - heading [level=2] [ref=f142e496]:
                - link "Copy link to faq" [ref=f142e497] [cursor=pointer]:
                  - /url: "#faq"
                  - generic [ref=f142e498]: FAQ
