            - paragraph [ref=f117e636]:
              - text: "The owner and anyone who has joined can invite teammates. People can also join from the Project's link:"
              - strong [ref=f117e637]: Copy link
              - text: in the same menu copies it, and only people in the Project can copy it. The owner can choose
              - strong [ref=f117e638]: Reset Share Link
              - text: to stop earlier copies from working.
            - paragraph [ref=f117e639]: A teammate needs access to the Project's repository to join. Joining isn't available with Privacy Mode (Legacy), on a Project that runs on a self-hosted machine, or on an archived Project.
