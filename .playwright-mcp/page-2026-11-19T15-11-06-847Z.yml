      - main [ref=f151e385]:
        - generic [ref=f151e388]:
          - generic [ref=f151e389]:
            - generic [ref=f151e390]: CLI
            - generic [ref=f151e392]:
              - heading "Shell Mode" [level=1] [ref=f151e393]
              - paragraph [ref=f151e394]: Shell Mode runs shell commands directly from the CLI without leaving your conversation. Use it for quick, non-interactive commands with safety checks and output displayed in the conversation.
              - heading [level=2] [ref=f151e397]:
                - link "Copy link to command-execution" [ref=f151e398] [cursor=pointer]:
                  - /url: "#command-execution"
                  - generic [ref=f151e399]: Command execution
              - paragraph [ref=f151e407]:
                - text: Commands run in your login shell (
                - code [ref=f151e408]: $SHELL
                - text: ") with the CLI's working directory and environment. Chain commands to run in other directories:"
              - generic [ref=f151e411]:
                - button [ref=f151e412] [cursor=pointer]
                - code [ref=f151e418]:
                  - generic [ref=f151e419]: cd subdir && npm test
              - heading [level=2] [ref=f151e420]:
                - link "Copy link to output" [ref=f151e421] [cursor=pointer]:
                  - /url: "#output"
                  - generic [ref=f151e422]: Output
              - paragraph [ref=f151e430]: Large outputs are truncated automatically and long-running processes timeout to maintain performance.
              - heading [level=2] [ref=f151e431]:
                - link "Copy link to limitations" [ref=f151e432] [cursor=pointer]:
                  - /url: "#limitations"
                  - generic [ref=f151e433]: Limitations
              - list [ref=f151e441]:
                - listitem [ref=f151e442]: Commands timeout after 30 seconds
                - listitem [ref=f151e443]: Long-running processes, servers, and interactive prompts are not supported
                - listitem [ref=f151e444]: Use short, non-interactive commands for best results
              - heading [level=2] [ref=f151e445]:
                - link "Copy link to permissions" [ref=f151e446] [cursor=pointer]:
                  - /url: "#permissions"
                  - generic [ref=f151e447]: Permissions
              - paragraph [ref=f151e455]:
                - text: Commands are checked against your permissions and team settings before execution. See
                - link "Permissions" [ref=f151e456] [cursor=pointer]:
                  - /url: /docs/cli/reference/permissions
                - text: for detailed configuration.
              - paragraph [ref=f151e457]: Admin policies may block certain commands, and commands with redirection cannot be allowlisted inline.
              - heading [level=2] [ref=f151e458]:
                - link "Copy link to usage-guidelines" [ref=f151e459] [cursor=pointer]:
                  - /url: "#usage-guidelines"
                  - generic [ref=f151e460]: Usage guidelines
              - paragraph [ref=f151e468]: Shell Mode works well for status checks, quick builds, file operations, and environment inspection.
              - paragraph [ref=f151e469]: Avoid long-running servers, interactive applications, and commands requiring input.
              - paragraph [ref=f151e470]:
                - text: Each command runs independently - use
                - code [ref=f151e471]: cd <dir> && ...
                - text: to run commands in other directories.
              - heading [level=2] [ref=f151e472]:
                - link "Copy link to troubleshooting" [ref=f151e473] [cursor=pointer]:
                  - /url: "#troubleshooting"
                  - generic [ref=f151e474]: Troubleshooting
              - list [ref=f151e482]:
                - listitem [ref=f151e483]:
                  - text: If a command hangs, cancel with
                  - generic [ref=f151e484]: Ctrl+C
                  - text: and add non-interactive flags
                - listitem [ref=f151e486]:
                  - text: When prompted for permissions, approve once or add to allowlist with
                  - generic [ref=f151e487]: Tab
                - listitem [ref=f151e489]:
                  - text: For truncated output, use
                  - generic [ref=f151e490]: Ctrl+O
                  - text: to expand
                - listitem [ref=f151e492]:
                  - text: To run in different directories, use
                  - code [ref=f151e493]: cd <dir> && ...
                  - text: since changes don't persist
                - listitem [ref=f151e494]:
                  - text: Shell Mode supports zsh and bash from your
                  - code [ref=f151e495]: $SHELL
                  - text: variable
              - heading [level=2] [ref=f151e496]:
                - link "Copy link to faq" [ref=f151e497] [cursor=pointer]:
