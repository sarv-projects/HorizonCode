                - rowgroup [ref=f60e1734]:
                  - row [ref=f60e1735]:
                    - cell "Allowlist" [ref=f60e1736]
                    - cell "Adds user to list (can use Bugbot)" [ref=f60e1737]
                    - cell "Removes user from list (cannot use Bugbot)" [ref=f60e1738]
                  - row [ref=f60e1739]:
