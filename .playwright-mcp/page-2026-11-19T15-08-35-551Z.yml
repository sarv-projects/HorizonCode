              - paragraph [ref=f60e1579]: All endpoints are rate-limited to 60 requests per minute per team.
              - heading [level=3] [ref=f60e1580]:
                - link "Copy link to enabling-or-disabling-repositories" [ref=f60e1581] [cursor=pointer]:
                  - /url: "#enabling-or-disabling-repositories"
                  - generic [ref=f60e1582]: Enabling or disabling repositories
              - paragraph [ref=f60e1590]:
                - text: Use the
                - code [ref=f60e1591]: /bugbot/repo/update
                - text: "endpoint to toggle Bugbot on or off for a repository:"
              - generic [ref=f60e1594]:
                - button [ref=f60e1595] [cursor=pointer]
                - code [ref=f60e1601]:
                  - generic [ref=f60e1602]: curl -X POST https://api.cursor.com/bugbot/repo/update \
                  - generic [ref=f60e1603]: "-H \"Authorization: Bearer $API_KEY\" \\"
                  - generic [ref=f60e1604]: "-H \"Content-Type: application/json\" \\"
                  - generic [ref=f60e1605]: "-d '{"
                  - generic [ref=f60e1606]: "\"repoUrl\": \"https://github.com/your-org/your-repo\","
                  - generic [ref=f60e1607]: "\"enabled\": true,"
                  - generic [ref=f60e1608]: "\"manualTriggerOnly\": false"
                  - generic [ref=f60e1609]: "}'"
              - paragraph [ref=f60e1610]:
                - strong [ref=f60e1611]: "Parameters:"
              - list [ref=f60e1612]:
                - listitem [ref=f60e1613]:
                  - code [ref=f60e1614]: repoUrl
                  - text: "(string, required): The full URL of the repository"
                - listitem [ref=f60e1615]:
                  - code [ref=f60e1616]: enabled
                  - text: "(boolean, required):"
                  - code [ref=f60e1617]: "true"
                  - text: to enable Bugbot,
                  - code [ref=f60e1618]: "false"
                  - text: to disable it
                - listitem [ref=f60e1619]:
                  - code [ref=f60e1620]: manualTriggerOnly
                  - text: "(boolean, optional): When"
                  - code [ref=f60e1621]: "true"
                  - text: ", Bugbot won't run automatically on PR updates for this repository. Manual triggers, such as commenting"
                  - code [ref=f60e1622]: cursor review
                  - text: or
                  - code [ref=f60e1623]: bugbot run
                  - text: ", still work."
              - alert [ref=f60e1624]:
                - paragraph [ref=f60e1628]: The Automations UI may take a moment to reflect changes made through the API due to caching. The API response shows the current state in the database.
              - paragraph [ref=f60e1629]:
                - text: For Azure DevOps repositories, turn Bugbot on or off in
                - link "Bugbot in Automations" [ref=f60e1630] [cursor=pointer]:
                  - /url: https://cursor.com/automations/from-cursor/bugbot
                - text: . This endpoint returns
                - code [ref=f60e1631]: "400"
                - text: for repository URLs on
                - code [ref=f60e1632]: dev.azure.com
                - text: or
                - code [ref=f60e1633]: "*.visualstudio.com"
                - text: .
              - heading [level=3] [ref=f60e1634]:
                - link "Copy link to listing-repositories" [ref=f60e1635] [cursor=pointer]:
                  - /url: "#listing-repositories"
                  - generic [ref=f60e1636]: Listing repositories
              - paragraph [ref=f60e1644]:
                - text: Use the
                - code [ref=f60e1645]: /bugbot/repos
                - text: "endpoint to list all repositories with their Bugbot settings for your team:"
              - generic [ref=f60e1648]:
                - button [ref=f60e1649] [cursor=pointer]
                - code [ref=f60e1655]:
                  - generic [ref=f60e1656]: curl https://api.cursor.com/bugbot/repos \
                  - generic [ref=f60e1657]: "-H \"Authorization: Bearer $API_KEY\""
              - paragraph [ref=f60e1658]: The response includes each repository's enabled status, manual-only setting, and timestamps.
              - heading [level=3] [ref=f60e1659]:
                - link "Copy link to managing-user-access" [ref=f60e1660] [cursor=pointer]:
                  - /url: "#managing-user-access"
                  - generic [ref=f60e1661]: Managing user access
              - paragraph [ref=f60e1669]:
                - text: Use the
                - code [ref=f60e1670]: /bugbot/user/update
                - text: endpoint to control which GitHub, GitLab, or Bitbucket users can use your team's Bugbot licenses. Enterprises use this to integrate Bugbot provisioning with internal access-request tools.
              - heading [level=4] [ref=f60e1671]:
                - link "Copy link to prerequisites" [ref=f60e1672] [cursor=pointer]:
                  - /url: "#prerequisites"
                  - generic [ref=f60e1673]: Prerequisites
              - paragraph [ref=f60e1681]:
                - text: Before calling this endpoint, enable an allowlist or blocklist mode in your
                - link "team Bugbot settings" [ref=f60e1682] [cursor=pointer]:
                  - /url: https://cursor.com/automations/from-cursor/bugbot
                - text: ":"
              - list [ref=f60e1683]:
                - listitem [ref=f60e1684]:
                  - strong [ref=f60e1685]: Allowlist mode ("Only...")
                  - text: ": Only users on the list can use Bugbot"
                - listitem [ref=f60e1686]:
                  - strong [ref=f60e1687]: Blocklist mode ("Everyone but...")
                  - text: ": All users can use Bugbot except those on the list"
              - paragraph [ref=f60e1688]: If neither mode is enabled, the API returns an error.
              - heading [level=4] [ref=f60e1689]:
                - link "Copy link to adding-or-removing-a-user" [ref=f60e1690] [cursor=pointer]:
                  - /url: "#adding-or-removing-a-user"
                  - generic [ref=f60e1691]: Adding or removing a user
              - generic [ref=f60e1701]:
                - button [ref=f60e1702] [cursor=pointer]
                - code [ref=f60e1708]:
                  - generic [ref=f60e1709]: curl -X POST https://api.cursor.com/bugbot/user/update \
                  - generic [ref=f60e1710]: "-H \"Authorization: Bearer $API_KEY\" \\"
                  - generic [ref=f60e1711]: "-H \"Content-Type: application/json\" \\"
                  - generic [ref=f60e1712]: "-d '{"
                  - generic [ref=f60e1713]: "\"username\": \"octocat\","
                  - generic [ref=f60e1714]: "\"allow\": true"
