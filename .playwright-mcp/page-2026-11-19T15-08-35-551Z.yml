                    - cell "Adds user to blocklist (cannot use Bugbot)" [ref=f60e1742]
              - paragraph [ref=f60e1743]:
                - strong [ref=f60e1744]: "Response:"
              - generic [ref=f60e1747]:
                - button [ref=f60e1748] [cursor=pointer]
                - code [ref=f60e1754]:
                  - generic [ref=f60e1755]: "{"
                  - generic [ref=f60e1756]: "\"outcome\": \"success\","
                  - generic [ref=f60e1757]: "\"message\": \"Updated team-level allowlist for @octocat\","
                  - generic [ref=f60e1758]: "\"updatedTeamSettings\": true,"
                  - generic [ref=f60e1759]: "\"updatedInstallations\": 0"
                  - generic [ref=f60e1760]: "}"
              - alert [ref=f60e1761]:
                - paragraph [ref=f60e1765]: The allowlist is stored at the team level and applies across all GitHub, GitLab, and Bitbucket installations owned by that team. Usernames are normalized to lowercase.
              - heading [level=4] [ref=f60e1766]:
                - link "Copy link to example-provisioning-users-through-an-internal-tool" [ref=f60e1767] [cursor=pointer]:
                  - /url: "#example-provisioning-users-through-an-internal-tool"
                  - generic [ref=f60e1768]: "Example: provisioning users through an internal tool"
              - paragraph [ref=f60e1776]: Connect this API to an internal access-request portal. When an employee requests Bugbot access, the portal calls the API to add them. When they leave or lose access, it calls the API to remove them.
              - paragraph [ref=f60e1777]:
                - strong [ref=f60e1778]: "Grant access:"
