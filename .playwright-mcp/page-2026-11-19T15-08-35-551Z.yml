                  - generic [ref=f60e1811]: Pricing
              - paragraph [ref=f60e1819]: Bugbot uses usage-based billing.
              - alert [ref=f60e1820]:
                - paragraph [ref=f60e1824]:
                  - text: Bugbot pricing changed with the May 2026 pricing update. See the
                  - link "announcement blog post" [ref=f60e1825] [cursor=pointer]:
                    - /url: https://cursor.com/blog/may-2026-bugbot-changes
                  - text: for background. If you're still on the old seat-based plan, see
                  - link "legacy Bugbot pricing" [ref=f60e1826] [cursor=pointer]:
