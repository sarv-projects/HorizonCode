                  - code [ref=f60e1722]: allow
                  - text: "(boolean, required): Whether to grant or revoke access"
              - paragraph [ref=f60e1723]:
                - text: How
                - code [ref=f60e1724]: allow
                - text: "behaves depends on the active mode:"
              - table [ref=f60e1726]:
