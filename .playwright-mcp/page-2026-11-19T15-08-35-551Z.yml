                    - cell "No" [ref=f60e1475]
                    - cell "No" [ref=f60e1476]
              - paragraph [ref=f60e1477]: Installation settings offer only the modes your provider supports. If your personal setting picks a mode your provider doesn't support, Bugbot skips the autofix run for that PR.
              - paragraph [ref=f60e1478]:
                - text: On a stacked PR, where the base branch isn't the repository's default branch,
                - strong [ref=f60e1479]: Commit to Existing Branch
                - text: doesn't push to your branch. On GitHub and Origin, Autofix delivers the fix on a new branch instead; apply it by commenting
                - code [ref=f60e1480]: "@cursor push <sha>"
                - text: on the PR. On GitLab and Bitbucket, Autofix skips stacked PRs.
              - alert [ref=f60e1481]:
                - paragraph [ref=f60e1485]:
