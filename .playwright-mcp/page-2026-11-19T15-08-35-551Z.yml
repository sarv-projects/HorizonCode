                      - text: — Push fixes directly to the PR branch (max 3 attempts per PR to prevent loops)
                  - paragraph [ref=f60e1454]: Individual team members can override these defaults in their personal settings.
              - paragraph [ref=f60e1455]: "Available autofix modes depend on your repository provider:"
              - table [ref=f60e1457]:
                - rowgroup [ref=f60e1458]:
                  - row [ref=f60e1459]:
                    - columnheader "Provider" [ref=f60e1460]
