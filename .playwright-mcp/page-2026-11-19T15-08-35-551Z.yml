                  - generic [ref=f60e1070]: Effort Levels
              - paragraph [ref=f60e1078]: Effort levels control how much time Bugbot spends reasoning during a review. Higher effort levels can find more bugs, but each review may take longer and take up more usage.
              - paragraph [ref=f60e1079]: "Choose from these effort levels:"
              - list [ref=f60e1080]:
                - listitem [ref=f60e1081]:
                  - strong [ref=f60e1082]: Low
                  - text: ": Optimizes for cost, with quality close to Default. Reviews are cheaper and take longer."
                - listitem [ref=f60e1083]:
                  - strong [ref=f60e1084]: Default
                  - text: ": Optimizes for efficiency and speed. Reviews are less expensive, but Bugbot may find fewer bugs."
                - listitem [ref=f60e1085]:
                  - strong [ref=f60e1086]: High
                  - text: ": Spends more time reasoning. Reviews are more expensive and take longer, but Bugbot may find more bugs."
                - listitem [ref=f60e1087]:
                  - strong [ref=f60e1088]: Smart
                  - text: ": Lets you describe when Bugbot should use Low, Default, or High. Cursor dynamically sets effort levels based on your instructions. To choose, Smart reads your instructions with the PR's title, author, repository name, and diff (trimmed on large PRs). It doesn't read the PR description, labels, or"
                  - code [ref=f60e1089]: BUGBOT.md
                  - text: . Smart uses Low only when your instructions ask for it, and uses Default when they don't clearly call for another level. When Smart picks Default or High and the review finds issues, the review comment names the effort level it used.
              - alert [ref=f60e1090]:
