                  - generic [ref=f60e1874]: Troubleshooting
              - paragraph [ref=f60e1882]: "If Bugbot isn't working:"
              - list [ref=f60e1883]:
                - listitem [ref=f60e1884]:
                  - strong [ref=f60e1885]: Enable verbose mode
                  - text: by commenting
