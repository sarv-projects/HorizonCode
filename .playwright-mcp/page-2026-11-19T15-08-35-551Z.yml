      - main [ref=f60e384]:
        - generic [ref=f60e387]:
          - generic [ref=f60e388]:
            - generic [ref=f60e389]: Cloud Agents
            - generic [ref=f60e391]:
              - heading "Bugbot" [level=1] [ref=f60e392]
              - paragraph [ref=f60e393]: Bugbot reviews pull requests and identifies bugs, security issues, and code quality problems.
              - paragraph [ref=f60e394]:
                - text: Configure Bugbot in
                - link "Automations" [ref=f60e395] [cursor=pointer]:
                  - /url: https://cursor.com/automations/from-cursor/bugbot
                - text: .
              - heading [level=2] [ref=f60e398]:
                - link "Copy link to how-it-works" [ref=f60e399] [cursor=pointer]:
                  - /url: "#how-it-works"
                  - generic [ref=f60e400]: How it works
              - paragraph [ref=f60e408]: Bugbot analyzes PR diffs and leaves comments with explanations and fix suggestions. It runs automatically on each PR update or manually when triggered.
              - list [ref=f60e409]:
                - listitem [ref=f60e410]:
                  - text: Runs
                  - strong [ref=f60e411]: automatic reviews
                  - text: on every PR update
                - listitem [ref=f60e412]:
                  - strong [ref=f60e413]: Manual trigger
                  - text: by commenting
                  - code [ref=f60e414]: cursor review
                  - text: or
                  - code [ref=f60e415]: bugbot run
                  - text: on any PR. Bugbot ignores these commands when a bot account or GitHub App posts them.
                - listitem [ref=f60e416]:
                  - strong [ref=f60e417]: Uses existing PR comments as context
                  - text: ": reads connected PR comments (top-level and inline) to avoid duplicate suggestions and build on prior feedback"
                - listitem [ref=f60e418]:
                  - strong [ref=f60e419]: Fix in Cursor
                  - text: links open issues directly in Cursor
                - listitem [ref=f60e420]:
                  - strong [ref=f60e421]: Fix in Web
                  - text: links open issues directly in
                  - link "cursor.com/agents" [ref=f60e422] [cursor=pointer]:
                    - /url: https://cursor.com/agents
              - heading [level=3] [ref=f60e423]:
                - link "Copy link to limits" [ref=f60e424] [cursor=pointer]:
                  - /url: "#limits"
                  - generic [ref=f60e425]: Limits
              - list [ref=f60e433]:
                - listitem [ref=f60e434]:
                  - strong [ref=f60e435]: PR size
                  - text: ": Bugbot skips PRs larger than its default review-size limit, measured in changed lines and diff characters, and posts a comment asking you to split the change. A skipped run records no review usage."
                - listitem [ref=f60e436]:
                  - strong [ref=f60e437]: Generated files
                  - text: ": Bugbot leaves out files marked"
                  - code [ref=f60e438]: linguist-generated
                  - text: in
                  - code [ref=f60e439]: .gitattributes
                  - text: . They don't count toward the PR size limit.
                - listitem [ref=f60e440]:
                  - strong [ref=f60e441]: Bot-authored PRs
                  - text: ": Bugbot caps how many reviews it runs on PRs opened by bot accounts, per team. Every review counts, including repeat reviews of the same PR. The cap is a default, and your team's cap can differ."
              - heading [level=2] [ref=f60e442]:
                - link "Copy link to setup" [ref=f60e443] [cursor=pointer]:
                  - /url: "#setup"
                  - generic [ref=f60e444]: Setup
              - paragraph [ref=f60e452]: Connect your repositories through the Cursor dashboard to start using Bugbot.
              - list [ref=f60e453]:
                - listitem [ref=f60e454]:
                  - strong [ref=f60e455]: Origin
                  - text: ": See the"
                  - link "Origin page" [ref=f60e456] [cursor=pointer]:
                    - /url: /docs/origin
                - listitem [ref=f60e457]:
                  - strong [ref=f60e458]: GitHub
                  - text: "(including GitHub Enterprise Server): See the"
                  - link "GitHub integration page" [ref=f60e459] [cursor=pointer]:
                    - /url: /docs/integrations/github
                - listitem [ref=f60e460]:
                  - strong [ref=f60e461]: GitLab
                  - text: "(including GitLab Self-Hosted): See the"
                  - link "GitLab integration page" [ref=f60e462] [cursor=pointer]:
                    - /url: /docs/integrations/gitlab
                - listitem [ref=f60e463]:
                  - strong [ref=f60e464]: Bitbucket
                  - text: "(including Bitbucket Data Center): See the"
                  - link "Bitbucket integration page" [ref=f60e465] [cursor=pointer]:
                    - /url: /docs/integrations/bitbucket
                - listitem [ref=f60e466]:
                  - strong [ref=f60e467]: Azure DevOps
                  - text: "(Azure DevOps Services): See the"
                  - link "Azure DevOps integration page" [ref=f60e468] [cursor=pointer]:
                    - /url: /docs/integrations/azure-devops#set-up-bugbot
              - paragraph [ref=f60e469]:
                - text: After connecting, open
                - link "Bugbot in Automations" [ref=f60e470] [cursor=pointer]:
                  - /url: https://cursor.com/automations/from-cursor/bugbot
                - text: to manage which repositories Bugbot reviews.
              - alert [ref=f60e471]:
                - paragraph [ref=f60e475]: On GitHub, connecting turns Bugbot on for the repositories you grant access to. Repositories stay off when someone who isn't a team admin connects an enterprise team, or a team that already has Bugbot on. On GitLab, Bitbucket, Azure DevOps, and Origin, turn Bugbot on per repository.
              - paragraph [ref=f60e476]:
                - text: On a team, members who can't change an installation's settings see
                - strong [ref=f60e477]: Request access
                - text: instead of the switch on a repository where Bugbot is off. Requesting emails your team admins a one-click link to turn Bugbot on for that repository, and the button changes to
                - strong [ref=f60e478]: Requested
                - text: . The repository stays off until an admin turns it on.
              - paragraph [ref=f60e479]:
                - text: For a comparison with Security Reviewer, see
                - link "Security Review source control support" [ref=f60e480] [cursor=pointer]:
                  - /url: /docs/security-review#source-control-support
                - text: .
              - heading [level=2] [ref=f60e481]:
                - link "Copy link to ci-check-statuses" [ref=f60e482] [cursor=pointer]:
                  - /url: "#ci-check-statuses"
                  - generic [ref=f60e483]: CI check statuses
              - paragraph [ref=f60e491]:
                - text: Bugbot publishes a status for each review run. On GitHub, this appears as a check named
                - code [ref=f60e492]: Cursor Bugbot
                - text: . On Bitbucket, this appears as a build status with the key
                - code [ref=f60e493]: cursor-bugbot
                - text: . On Azure DevOps, this appears as a status with the context
                - code [ref=f60e494]: cursor-bugbot/review
                - text: ". The status uses these conclusions:"
              - list [ref=f60e495]:
                - listitem [ref=f60e496]:
                  - code [ref=f60e497]: success
                  - text: ": Bugbot found no issues, and there are no unresolved Bugbot comments from earlier runs."
                - listitem [ref=f60e498]:
                  - code [ref=f60e499]: neutral
                  - text: ": Bugbot found issues, the run was cancelled by a newer commit, or Bugbot hit an internal error. This is the default conclusion when Bugbot reports findings."
                - listitem [ref=f60e500]:
                  - code [ref=f60e501]: failure
                  - text: ": Bugbot found issues and the check is configured to fail on unresolved issues."
              - paragraph [ref=f60e502]:
                - text: If you use branch protection, require the Bugbot check or build status to make sure Bugbot runs before merge. Requiring the status alone does not block merges on findings because findings default to
                - code [ref=f60e503]: neutral
                - text: . If fail-on-unresolved-issues behavior is available for your organization, enable it to make unresolved findings produce a failing status. Bugbot does not emit a
                - code [ref=f60e504]: skipped
                - text: conclusion.
              - paragraph [ref=f60e505]:
                - text: When Bugbot Autofix is enabled, GitHub may also show a separate
                - code [ref=f60e506]: Cursor Bugbot Autofix
                - text: check. That check only uses
                - code [ref=f60e507]: success
                - text: or
                - code [ref=f60e508]: neutral
                - text: .
              - heading [level=2] [ref=f60e509]:
                - link "Copy link to configuration" [ref=f60e510] [cursor=pointer]:
                  - /url: "#configuration"
                  - generic [ref=f60e511]: Configuration
              - generic [ref=f60e519]:
                - tablist [ref=f60e520]:
                  - tab "Individual" [ref=f60e521] [cursor=pointer]
                  - tab "Team" [selected] [ref=f60e522] [cursor=pointer]
                  - tab "Enterprise" [ref=f60e523] [cursor=pointer]
                - tabpanel "Team" [ref=f60e524]:
                  - heading [level=3] [ref=f60e525]:
                    - link "Copy link to repository-settings" [ref=f60e526] [cursor=pointer]:
                      - /url: "#repository-settings"
                      - generic [ref=f60e527]: Repository settings
                  - paragraph [ref=f60e535]: "Team users and admins can enable Bugbot per repository, configure allow/deny lists for reviewers, and set:"
                  - list [ref=f60e536]:
                    - listitem [ref=f60e537]:
                      - text: Run
                      - strong [ref=f60e538]: only once
                      - text: per PR per installation, skipping subsequent commits
                  - paragraph [ref=f60e539]:
                    - text: Bugbot runs for all contributors to enabled private repositories, regardless of team membership. On public repositories, the
                    - strong [ref=f60e540]: Public repositories
                    - text: switch in Bugbot's
                    - strong [ref=f60e541]: Team
                    - text: settings decides whether automatic reviews cover pull requests from people outside the team and from bots. If no admin has changed it, it's on for teams created before October 22, 2026 and off for teams created since. The switch doesn't affect manual reviews started with
                    - code [ref=f60e542]: cursor review
                    - text: or
                    - code [ref=f60e543]: bugbot run
                    - text: .
                  - heading [level=3] [ref=f60e544]:
                    - link "Copy link to personal-settings" [ref=f60e545] [cursor=pointer]:
                      - /url: "#personal-settings"
                      - generic [ref=f60e546]: Personal settings
                  - paragraph [ref=f60e554]: "Team members can override settings for their own PRs:"
                  - list [ref=f60e555]:
                    - listitem [ref=f60e556]:
                      - text: Run
                      - strong [ref=f60e557]: only when mentioned
                      - text: by commenting
                      - code [ref=f60e558]: cursor review
                      - text: or
                      - code [ref=f60e559]: bugbot run
                    - listitem [ref=f60e560]:
                      - text: Run
                      - strong [ref=f60e561]: only once
                      - text: per PR, skipping subsequent commits
                    - listitem [ref=f60e562]:
                      - strong [ref=f60e563]: Enable reviews on draft PRs
                      - text: to include draft pull requests in automatic reviews
              - heading [level=3] [ref=f60e564]:
                - link "Copy link to repository-config-file" [ref=f60e565] [cursor=pointer]:
                  - /url: "#repository-config-file"
                  - generic [ref=f60e566]: Repository config file
              - paragraph [ref=f60e574]: "You can optionally configure Bugbot from a repo-level YAML file:"
              - generic [ref=f60e577]:
                - button [ref=f60e578] [cursor=pointer]
                - code [ref=f60e584]:
                  - generic [ref=f60e585]: "# .cursor/config/bugbot.yaml"
                  - generic [ref=f60e586]: "version: 1"
                  - generic [ref=f60e588]: "triggers:"
                  - generic [ref=f60e589]: "drafts: false"
                  - generic [ref=f60e590]: "frequency: everyPush # everyPush | oncePerPr"
                  - generic [ref=f60e592]: "review:"
                  - generic [ref=f60e593]: "effort: default # low | default | high | smart"
                  - generic [ref=f60e594]: "smartPrompt: \"\""
                  - generic [ref=f60e595]: "incremental: true"
                  - generic [ref=f60e597]: "prSummary:"
                  - generic [ref=f60e598]: "mode: comment # disabled | description | comment"
                  - generic [ref=f60e599]: "riskScore: true"
                  - generic [ref=f60e601]: "autofix:"
                  - generic [ref=f60e602]: "mode: disabled # disabled | newBranch | existingBranch"
              - paragraph [ref=f60e603]: All fields are optional. If the file is missing, Bugbot uses the same behavior as before. If a field is missing or invalid, Bugbot ignores that field and falls back to the next setting in the precedence order. Bugbot ignores files larger than 64 KB.
              - paragraph [ref=f60e604]:
                - text: Bugbot reads
                - code [ref=f60e605]: .cursor/config/bugbot.yaml
                - text: at the repo root from the PR's base branch, the branch the PR merges into. The file must be committed and pushed to the repo, and its settings apply only to that repo. Bugbot does not read the PR head version, so a PR cannot change how Bugbot reviews itself. Use code review and
                - code [ref=f60e606]: CODEOWNERS
                - text: to control who can change this file.
              - paragraph [ref=f60e607]: "Precedence order, from highest to lowest:"
              - list [ref=f60e608]:
                - listitem [ref=f60e609]: The PR author's personal overrides, for their own PRs.
                - listitem [ref=f60e610]:
                  - code [ref=f60e611]: .cursor/config/bugbot.yaml
                  - text: .
                - listitem [ref=f60e612]: Team and organization settings from the dashboard.
              - paragraph [ref=f60e613]:
                - code [ref=f60e614]: autofix.mode
                - text: can lower the
                - link "Autofix" [ref=f60e615] [cursor=pointer]:
                  - /url: "#autofix"
                - text: mode from your dashboard settings, but it can't raise it. For example, it can change
                - strong [ref=f60e616]: Commit to Existing Branch
