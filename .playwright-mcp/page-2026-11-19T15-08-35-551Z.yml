                - strong [ref=f60e1717]: "Parameters:"
              - list [ref=f60e1718]:
                - listitem [ref=f60e1719]:
                  - code [ref=f60e1720]: username
                  - text: "(string, required): The GitHub, GitLab, or Bitbucket username (case-insensitive)"
