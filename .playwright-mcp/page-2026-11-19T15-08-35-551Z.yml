                      - generic [ref=f60e1845]: Usage-based billing
                  - paragraph [ref=f60e1853]: "Bugbot Teams includes:"
                  - list [ref=f60e1854]:
                    - listitem [ref=f60e1855]: Code reviews on all PRs
                    - listitem [ref=f60e1856]: Analytics and reporting
                    - listitem [ref=f60e1857]: The ability to set the effort level Bugbot uses for reviews
                    - listitem [ref=f60e1858]: Advanced rules and settings
                  - paragraph [ref=f60e1859]:
                    - text: Bugbot Teams bills from the team's prepaid credit, or from on-demand spend on a legacy Teams plan. See the
                    - link "pricing page" [ref=f60e1860] [cursor=pointer]:
                      - /url: https://cursor.com/pricing#bugbot
                    - text: for current rates.
                  - heading [level=3] [ref=f60e1861]:
